led{opacity:.35;cursor:not-allowed}.sim-counter{color:var(--muted);font:.68rem ui-monospace,monospace;white-space:nowrap;text-align:center}

  <script>
    /* All text lives in this one file so the learning centre remains fully translatable offline. */
    const icons = ['📶','💬','🛡️','💳','🏛️','🌱'];
    const colours = ['#49d9ff','#9c7bff','#38e38c','#ffad55','#49d9ff','#38e38c'];
    const moduleIcons = ['📚','🏛️','🩺','🌾'];
    const moduleColours = ['#9c7bff','#49d9ff','#ff6673','#38e38c'];

    const DATA = {
      en: {
        nav:['1. Home','2. Problems & Solutions','3. Learn & Practice','4. Safety Guide'],
        heroPill:'VILLAGE DIGITAL AWARENESS', heroTitle:'Internet use in villages,<br><span class="gradient-text">made safe and simple.</span>', heroCopy:'A friendly learning centre for families to use online services with confidence, spot scams early, and turn a phone into a helpful everyday tool.', heroLearn:'Start learning trail', heroSafety:'Try safety simulator', trust:['✓ Simple language','✓ Learn at your own pace','✓ Works best with family'], signalTitle:'Every safe click builds confidence.', signalCopy:'Learn one small action today—from checking an address to saving a health record—and make your next online task easier.', signalStatus:'● READY FOR YOUR NEXT SMART STEP',
        projectBadge:'PROJECT SUMMARY & PROFILE', projectTitle:'About our village digital literacy project', projectCopy:'Smartphones are common, but online tools can still feel confusing or risky. RuralNet turns useful daily tasks—learning, communication, banking, healthcare, farming and government services—into clear, safe steps that everyone can practise.', goalsTitle:'◎ Project objectives — tap a card for practical do’s & don’ts', goalsCopy:'Choose any topic to open a short safety guide. Each guide has actions you can use today.',
        objectives:[['Internet & digital basics','Turn on data wisely, browse confidently, and keep your phone healthy.'],['Online services & communication','Use useful apps and messages without giving away private information.'],['Cyber safety awareness','Recognise scams, fake prizes, unsafe calls and harmful links.'],['Payments & online education','Use UPI carefully and find trustworthy learning resources.'],['Government online services','Check applications, benefits and documents through verified channels.'],['Responsible technology use','Share thoughtfully, check facts, and keep a healthy screen routine.']],
        stats:[['100%','Community surveys completed'],['450+','Villagers mentored'],['12','Awareness sessions held'],['4','Practical learning missions']], safetyBadge:'LIVE SIMULATOR',safetyCardTitle:'Interactive cyber safety screen',safetyCardCopy:'Practise deciding what to do when an urgent-looking message appears. It is a safe simulation—no real links are opened.',problemBadge:'HELP WORKSPACE',problemCardTitle:'Problems & solutions hub',problemCardCopy:'See frequent village internet challenges placed side by side with calm, practical recovery steps.',
        glossEyebrow:'NO JARGON ZONE',glossTitle:'Simple language <span>glossary terminal</span>',glossCopy:'Tap a word, or type it and press Enter. Difficult online words are explained with everyday examples.',terminalLabel:'DICTIONARY DECODER v3.0',termPrompt:'›› ENTER A WORD:',termDefault:'›› SYSTEM READY. PICK A WORD ABOVE OR TYPE OTP, PHISHING, HTTPS, CLOUD, OR SPAM.',termUnknown:'›› Unknown word. Please choose OTP, Phishing, HTTPS, Cloud, or Spam.',terms:{OTP:'›› OTP = One-Time Password. Think of it as a key that works for one door, one time only. Never read that key to anyone—not even a caller claiming to be from a bank.',Phishing:'›› PHISHING = a fake bait message. Like bait on a hook, it tries to make you reveal a PIN, password or personal detail. Stop, check, and report it.',HTTPS:'›› HTTPS = a protected website connection. The padlock and https help protect information in transit—but still check that the website name itself is genuine.',Cloud:'›› CLOUD = an online storage locker. It lets you keep a copy of photos or documents on secure internet servers so you can reach them from another device.',Spam:'›› SPAM = unwanted or misleading messages. Treat it like unwanted leaflets: do not respond, do not open unknown links, and delete or report it.'},
        faqEyebrow:'QUICK ANSWERS',faqTitle:'Common village <span>internet questions</span>',faqCopy:'Open a question for a clear, everyday answer.',faqs:[['How can I check whether an online link really belongs to the government?','Do not trust a search result or message just because it looks official. Start from a department’s verified app or official contact, inspect the full address carefully, and avoid sponsored search advertisements. If unsure, ask at an authorised service centre before entering any details.'],['What if my payment app freezes after I send money?','Do not repeatedly tap “Pay” or start a second payment. Wait, check your transaction history and save the reference number. Contact the bank or payment app through its official support channel if the status does not update. Never share your UPI PIN or OTP while asking for help.'],['Is an easy PIN like 1234 safe if I might forget a hard one?','No. Avoid obvious PINs such as 1234, 0000, birth dates or the same code for every account. Use a different, hard-to-guess PIN for payment apps, enable phone screen lock or biometrics, and never write PINs where others can see them.']], toProblems:'View problems & solutions  →',
        problemsEyebrow:'CALM FIXES FOR REAL MOMENTS',problemsTitle:'Village internet <span>problems & solutions hub</span>',problemsCopy:'A quick side-by-side guide for common situations. When something feels urgent, slow down first—then use these steps.',returnHome:'← Return to home',mitigation:'Simple mitigation steps',inc:'Incident',problems:[
          ['Fake website links in search results','Someone looking for ration, land or benefit information may click a copycat website or a paid advertisement. It can collect personal details.',['Use the official department app, bookmarked address, or an authorised service centre to begin.','Read the full web address, not only the page logo or first search result.','Never enter Aadhaar, bank or OTP details when a page feels unfamiliar.']],
          ['Threatening messages about electricity or pumps','A message says a connection will be stopped within an hour unless you pay or open a link. Fear and urgency are common scam tools.',['Do not open the link or call the number in the message.','Check the bill or account only through the official provider app, website or local office.','Keep a screenshot and report suspicious messages instead of forwarding them.']],
          ['Payment pending when the network is weak','A payment screen spins, money may appear debited, and the shopkeeper has not received it.',['Do not make a second payment until the first status is clear.','Check the transaction history and note the UTR/reference number.','Use official bank/app support if needed; never give your PIN or OTP to “support”.']],
          ['A broker gives an uncertain printed receipt','An unauthorised person offers to submit forms for a high fee and hands over a receipt that may not be from a real system.',['Use authorised centres and ask for the official fee before service.','Verify the application number yourself on the official portal or with the department.','Do not share copied identity documents or account PINs with a broker.']],
          ['The same easy PIN is used everywhere','A simple or reused password gives one thief a path into several accounts.',['Keep payment, email and social accounts separate.','Use a strong unique passphrase or PIN and enable biometric lock where appropriate.','Never save passwords on a shared computer; log out fully after use.']]
        ],
        learnEyebrow:'NEW · LEARN & PRACTICE',learnTitle:'Your everyday <span>digital learning trail</span>',learnCopy:'Four short missions turn online services into habits. Read one, answer a quick check, then unlock your progress. There is no hurry—understanding matters more than speed.',progressMessage:'Missions completed',moduleLabel:'MISSION',stepsLabel:'Try these safe steps',smartSignal:'Smart signal',quickCheck:'Quick check',answerFeedbackGood:'Great choice! This mission is marked complete. Keep building your safe digital habits.',answerFeedbackTry:'Not quite. Read the steps once more and choose the safest action.',nextMission:'Next mission →',
        modules:[
          {title:'Online education',hook:'A phone can become a small classroom when you choose the right source and build a simple study routine.',steps:[['Start with a trusted source','Ask a teacher, school or recognised education provider for the correct app, class link or channel.'],['Protect the learner profile','Use a parent/guardian-approved account. Do not post a child’s photo, address, school ID or class link publicly.'],['Make learning stick','Save useful lessons for offline viewing when possible. Set a short daily time and discuss one new idea with family.']],signal:'A real learning service explains who provides it, what it costs (if anything), and how to get help. Be careful with “guaranteed job” or “instant certificate” ads.',question:'A message promises a paid certificate today if you send money to a personal number. What is safest?',options:['Pay quickly before the offer ends','Ask your teacher / use the official institution contact','Forward it to friends'],correct:1},
          {title:'Government services',hook:'Government services can save travel and time—but begin with a verified route, not an urgent message or an advertisement.',steps:[['Begin from a verified source','Use an official department app, its verified website, or an authorised service centre. Type the address or use a trusted bookmark instead of message links.'],['Keep a small record','After submitting an application, save the reference number, date and receipt. It helps you check progress later.'],['Finish safely','Log out after using a shared computer. Keep documents in DigiLocker or another secure personal location rather than public chats.']],signal:'A genuine office will not ask for your OTP, UPI PIN or remote-screen access to “release” a benefit. When unsure, verify through the department’s public contact number.',question:'What should you do before entering personal details for a scheme?',options:['Open the first sponsored search result','Verify the service through an official app, office or known public contact','Send your documents to any helpful-looking chat account'],correct:1},
          {title:'Digital healthcare',hook:'Online health tools can help you find reliable information and appointments—while your private health details still deserve care.',steps:[['Use recognised health services','For appointments, teleconsultation or records, choose a known hospital, government health service, or provider recommended by a qualified professional.'],['Share only what is needed','Health records, prescriptions and IDs are private. Send them only through a verified clinic channel and never to a random caller or social-media account.'],['Know when to seek direct care','For emergencies, severe symptoms or medical doubt, contact local emergency/health services or visit a qualified clinician. An internet message is not a diagnosis.']],signal:'No honest service can diagnose every problem from one forwarded message. Avoid miracle-cure videos, unverified medicine sellers, and requests for payment before a clear consultation.',question:'A stranger asks you to send a prescription photo over chat to “unlock free medicine.” What is safest?',options:['Send it; the offer sounds helpful','Verify through your clinic or local health centre first','Post it in a public group to ask'],correct:1},
          {title:'Smart agriculture',hook:'Weather, prices and farming advice are most useful when you compare trusted sources with local conditions and expert guidance.',steps:[['Check source and date','Use government agriculture channels, agricultural universities, recognised market information, or local extension workers. Check when an update was published.'],['Compare before acting','Do not change seed, pesticide or fertiliser use because of one video. Compare advice with local officers and instructions on the product label.'],['Keep farm information private','Share field photos only when needed with a trusted adviser. Do not send bank details, land documents or OTPs to people offering surprise grants.']],signal:'Good farming guidance states crop, season, location and limits. “Double yield in one day” or “pay now for a subsidy” messages are warning signs.',question:'Which message deserves the most caution?',options:['A dated advisory confirmed by a local agriculture officer','A “guaranteed huge yield” post asking for an advance payment','A market price checked on a recognised source'],correct:1}
        ],
        guides:[
          {title:'Internet & digital basics',sub:'Small habits that help your phone, data and privacy stay healthy.',dos:['Turn off mobile data or hotspot when you are not using it.','Install device and app updates from the official store.','Keep some free storage and remove old, unnecessary files.','Use a screen lock and keep Bluetooth off when not needed.'],donts:['Do not install apps sent as unknown files or links.','Do not share your hotspot without a password.','Do not ignore a phone that is overheating or behaving strangely.','Do not let strangers change important phone settings.']},
          {title:'Online services & communication',sub:'Use messages, calls and online accounts without losing control of your information.',dos:['Confirm a contact through another known channel before trusting an urgent request.','Use privacy settings and keep official group contacts saved.','Check a doctor, seller or service provider through a trusted source.','Pause before forwarding a message.'],donts:['Do not send medical reports, identity documents or land papers to unknown chats.','Do not join reward groups that require payment or personal details.','Do not answer repeated calls from unknown international numbers.','Do not download unknown attachments.']},
          {title:'Cyber safety awareness',sub:'Defences against urgent calls, fake prizes and messages that try to frighten you.',dos:['Stop and verify if anyone demands money, an OTP or immediate action.','Block and report suspicious numbers and messages.','Use a SIM PIN and a strong phone screen lock.','Contact the bank through an official number if you fear fraud.'],donts:['Never tell anyone your OTP, UPI PIN, card PIN or password.','Do not open shortened or unfamiliar links from messages.','Do not install screen-sharing or remote-control apps for a caller.','Do not use open Wi‑Fi for banking or private documents.']},

          {title:'Government online services',sub:'A safer way to check benefits, documents and application status.',dos:['Start from a verified official app, contact or authorised service centre.','Keep application numbers and receipts safely.','Log out of shared computers completely.','Use a secure document wallet such as DigiLocker where available.'],donts:['Do not pay an unauthorised broker who promises a faster result.','Do not trust sponsored search ads without verification.','Do not save bank passwords on a public computer.','Do not post land papers or application numbers in public groups.']},
          {title:'Responsible technology use',sub:'Build a useful, kind and balanced digital routine for the whole community.',dos:['Check important news with trusted local and official sources before sharing.','Set aside phone-free time for family, work, rest and farming.','Report hateful, abusive or scam content.','Use the internet for learning, services and constructive ideas.'],donts:['Do not forward rumours about safety, health or community conflict.','Do not use abusive language online.','Do not share someone’s photo or video without permission.','Do not believe miracle health or crop claims without trusted advice.']}

        projectBadge:'परियोजना सारांश व प्रोफाइल',projectTitle:'हमारी ग्रामीण डिजिटल साक्षरता परियोजना',projectCopy:'स्मार्टफोन आम हैं, पर ऑनलाइन टूल अभी भी उलझन या जोखिम भरे लग सकते हैं। RuralNet सीखने, बातचीत, बैंकिंग, स्वास्थ्य, खेती और सरकारी सेवाओं के रोज़मर्रा के कामों को स्पष्ट और सुरक्षित चरणों में बदलता है।',goalsTitle:'◎ परियोजना के उद्देश्य — व्यावहारिक करें/न करें देखने के लिए कार्ड दबाएं',goalsCopy:'छोटी सुरक्षा गाइड खोलने के लिए कोई भी विषय चुनें। हर गाइड में आज अपनाने योग्य कदम हैं।',
        objectives:[['इंटरनेट व डिजिटल मूल बातें','डेटा समझदारी से चलाएं, भरोसे से ब्राउज़ करें और फोन को स्वस्थ रखें।'],['ऑनलाइन सेवाएं व संवाद','निजी जानकारी दिए बिना उपयोगी ऐप और संदेश अपनाएं।'],['साइबर सुरक्षा जागरूकता','फ्रॉड, नकली इनाम, असुरक्षित कॉल और लिंक पहचानें।'],['भुगतान व ऑनलाइन शिक्षा','UPI सावधानी से इस्तेमाल करें और भरोसेमंद सीखने के साधन खोजें।'],['सरकारी ऑनलाइन सेवाएं','सत्यापित माध्यम से आवेदन, लाभ और दस्तावेज देखें।'],['जिम्मेदार तकनीक उपयोग','सोच-समझकर साझा करें, तथ्य जांचें और संतुलित स्क्रीन समय रखें।']],
        stats:[['100%','सामुदायिक सर्वे पूरे'],['450+','ग्रामीणों को मार्गदर्शन'],['12','जागरूकता सत्र'],['4','व्यावहारिक सीखने के मिशन']],safetyBadge:'लाइव सिम्युलेटर',safetyCardTitle:'इंटरैक्टिव साइबर सुरक्षा स्क्रीन',safetyCardCopy:'किसी जरूरी दिखने वाले संदेश पर क्या करना है, इसका सुरक्षित अभ्यास करें। इसमें कोई असली लिंक नहीं खुलता।',problemBadge:'सहायता केंद्र',problemCardTitle:'समस्या व समाधान हब',problemCardCopy:'गांवों की आम इंटरनेट चुनौतियां और उनके शांत, व्यावहारिक समाधान साथ-साथ देखें।',
        glossEyebrow:'सरल शब्द क्षेत्र',glossTitle:'सरल भाषा <span>शब्दावली टर्मिनल</span>',glossCopy:'किसी शब्द को दबाएं या टाइप करके Enter करें। कठिन ऑनलाइन शब्द रोज़ के उदाहरणों से समझें।',terminalLabel:'शब्दकोश डिकोडर v3.0',termPrompt:'›› शब्द लिखें:',termDefault:'›› सिस्टम तैयार है। ऊपर से शब्द चुनें या OTP, PHISHING, HTTPS, CLOUD अथवा SPAM लिखें।',termUnknown:'›› शब्द नहीं मिला। OTP, Phishing, HTTPS, Cloud या Spam चुनें।',terms:{OTP:'›› OTP = वन-टाइम पासवर्ड। यह ऐसी चाबी है जो एक दरवाज़े पर सिर्फ एक बार काम करती है। इसे किसी को न बताएं—बैंक कर्मचारी होने का दावा करने वाले को भी नहीं।',Phishing:'›› फिशिंग = नकली चारे वाला संदेश। जैसे कांटे पर चारा, यह आपसे पिन, पासवर्ड या निजी जानकारी निकलवाना चाहता है। रुकें, जांचें और रिपोर्ट करें।',HTTPS:'›› HTTPS = सुरक्षित वेबसाइट कनेक्शन। पैडलॉक और https रास्ते में जानकारी बचाने में मदद करते हैं, लेकिन वेबसाइट का असली नाम जांचना फिर भी जरूरी है।',Cloud:'›› क्लाउड = ऑनलाइन स्टोरेज लॉकर। फोटो या दस्तावेज की एक प्रति इंटरनेट के सुरक्षित सर्वर पर रहती है, जिसे दूसरे डिवाइस से भी देखा जा सकता है।',Spam:'›› स्पैम = अनचाहे या भ्रामक संदेश। इसे बिना मांगे पर्चे जैसा समझें: जवाब न दें, अनजान लिंक न खोलें और हटाएं या रिपोर्ट करें।'},
        faqEyebrow:'त्वरित उत्तर',faqTitle:'गांव के सामान्य <span>इंटरनेट सवाल</span>',faqCopy:'स्पष्ट और रोज़मर्रा का उत्तर देखने के लिए सवाल खोलें।',faqs:[['कैसे जांचूं कि ऑनलाइन लिंक सच में सरकारी है?','किसी सर्च रिजल्ट या संदेश को केवल आधिकारिक दिखने पर न मानें। विभाग के सत्यापित ऐप, आधिकारिक संपर्क या अधिकृत सेवा केंद्र से शुरुआत करें। पूरा पता ध्यान से देखें और “Sponsored” विज्ञापन से बचें। संदेह हो तो विवरण भरने से पहले सेवा केंद्र से पूछें।'],['पैसे भेजने के बाद पेमेंट ऐप रुक जाए तो क्या करूं?','बार-बार “Pay” न दबाएं और दूसरा भुगतान शुरू न करें। थोड़ा रुकें, ट्रांजैक्शन हिस्ट्री देखें और रेफरेंस नंबर सुरक्षित रखें। स्थिति न बदले तो बैंक या ऐप के आधिकारिक सहायता माध्यम से बात करें। मदद मांगते समय भी UPI PIN या OTP कभी न बताएं।'],['क्या 1234 जैसा आसान PIN सुरक्षित है?','नहीं। 1234, 0000, जन्मतिथि या हर खाते में एक जैसा कोड न रखें। पेमेंट ऐप के लिए अलग, अनुमान लगाना कठिन PIN रखें, फोन लॉक/बायोमेट्रिक चालू करें और PIN ऐसी जगह न लिखें जिसे कोई देख सके।']],toProblems:'समस्या व समाधान देखें  →',
        problemsEyebrow:'असली परिस्थितियों के शांत समाधान',problemsTitle:'ग्राम इंटरनेट <span>समस्या व समाधान हब</span>',problemsCopy:'आम परिस्थितियों के लिए त्वरित साथ-साथ गाइड। जब कुछ बहुत जरूरी लगे, पहले रुकें—फिर ये कदम अपनाएं।',returnHome:'← होम पर वापस जाएं',mitigation:'सरल सुरक्षा कदम',inc:'घटना',problems:[
          ['सर्च रिजल्ट में नकली वेबसाइट लिंक','राशन, भूमि या लाभ की जानकारी ढूंढते समय कोई व्यक्ति नकली वेबसाइट या पेड विज्ञापन खोल सकता है। वहां निजी जानकारी ली जा सकती है।',['शुरुआत विभाग के आधिकारिक ऐप, सुरक्षित बुकमार्क या अधिकृत सेवा केंद्र से करें।','केवल लोगो या पहले रिजल्ट के बजाय पूरा वेब पता पढ़ें।','अपरिचित पेज पर आधार, बैंक या OTP विवरण न डालें।']],
          ['बिजली या पंप को लेकर डराने वाले संदेश','संदेश कहता है कि एक घंटे में कनेक्शन कट जाएगा, अगर आप पैसे न दें या लिंक न खोलें। डर और जल्दी कराना फ्रॉड के आम तरीके हैं।',['लिंक न खोलें और संदेश में दिए नंबर पर कॉल न करें।','बिल की जांच केवल प्रदाता के आधिकारिक ऐप, वेबसाइट या स्थानीय कार्यालय से करें।','स्क्रीनशॉट रखें, संदिग्ध संदेश रिपोर्ट करें और उसे आगे न भेजें।']],
          ['कम नेटवर्क में भुगतान पेंडिंग','स्क्रीन घूमती रहती है, पैसे कटे हुए दिखते हैं, लेकिन दुकानदार को नहीं मिले।',['पहला स्टेटस साफ होने तक दूसरा भुगतान न करें।','ट्रांजैक्शन हिस्ट्री देखें और UTR/रेफरेंस नंबर लिखें।','जरूरत हो तो आधिकारिक बैंक/ऐप सहायता लें; “सपोर्ट” को PIN या OTP न दें।']],
          ['ब्रोकर की संदिग्ध प्रिंटेड रसीद','अनधिकृत व्यक्ति ज्यादा शुल्क लेकर फॉर्म भरने का दावा करता है और ऐसी रसीद दे सकता है जो असली सिस्टम की न हो।',['अधिकृत केंद्र ही चुनें और सेवा से पहले आधिकारिक शुल्क पूछें।','आवेदन नंबर को आधिकारिक पोर्टल या विभाग में खुद जांचें।','पहचान दस्तावेज की कॉपी या खाते का PIN ब्रोकर को न दें।']],
          ['हर जगह वही आसान PIN','सरल या दोहराया गया पासवर्ड एक व्यक्ति को कई खातों तक पहुंच दे सकता है।',['पेमेंट, ईमेल और सोशल अकाउंट अलग रखें।','मजबूत अलग पासफ्रेज/PIN रखें और संभव हो तो बायोमेट्रिक लॉक लगाएं।','साझा कंप्यूटर पर पासवर्ड सेव न करें; काम के बाद लॉग आउट करें।']]
        ],

        modules:[
          {title:'ऑनलाइन शिक्षा',hook:'सही स्रोत चुनकर और छोटी पढ़ाई की दिनचर्या बनाकर फोन एक छोटा कक्षा-कक्ष बन सकता है।',steps:[['भरोसेमंद स्रोत से शुरू करें','शिक्षक, स्कूल या मान्य शिक्षा संस्थान से सही ऐप, क्लास लिंक या चैनल पूछें।'],['विद्यार्थी प्रोफाइल सुरक्षित रखें','अभिभावक की अनुमति वाला खाता उपयोग करें। बच्चे की फोटो, पता, स्कूल ID या क्लास लिंक सार्वजनिक न करें।'],['सीख को यादगार बनाएं','संभव हो तो उपयोगी पाठ ऑफलाइन के लिए सहेजें। रोज़ थोड़ा समय तय करें और परिवार से एक नई बात साझा करें।']],signal:'असली लर्निंग सेवा बताती है कि उसे कौन चलाता है, लागत क्या है और मदद कैसे मिलेगी। “पक्का रोजगार” या “तुरंत सर्टिफिकेट” वाले विज्ञापन से सावधान रहें।',question:'एक संदेश व्यक्तिगत नंबर पर पैसे भेजने पर आज सर्टिफिकेट देने का वादा करता है। सबसे सुरक्षित क्या है?',options:['ऑफर खत्म होने से पहले तुरंत भुगतान करें','शिक्षक से पूछें / संस्था के आधिकारिक संपर्क का उपयोग करें','दोस्तों को आगे भेजें'],correct:1},

        objectives:[['ఇంటర్నెట్ & డిజిటల్ ప్రాథమికాలు','డేటాను తెలివిగా వాడండి, ధైర్యంగా బ్రౌజ్ చేయండి, ఫోన్‌ను ఆరోగ్యంగా ఉంచండి.'],['ఆన్‌లైన్ సేవలు & కమ్యూనికేషన్','వ్యక్తిగత సమాచారం ఇవ్వకుండా ఉపయోగకరమైన యాప్‌లు, మెసేజ్‌లు వాడండి.'],['సైబర్ భద్రత అవగాహన','మోసాలు, నకిలీ బహుమతులు, అసురక్షిత కాల్స్ మరియు లింకులను గుర్తించండి.'],['చెల్లింపులు & ఆన్‌లైన్ విద్య','UPIని జాగ్రత్తగా వాడండి; నమ్మకమైన విద్యా వనరులను కనుగొనండి.'],['ప్రభుత్వ ఆన్‌లైన్ సేవలు','ధృవీకరించిన మార్గాల ద్వారా దరఖాస్తులు, లబ్ధులు, పత్రాలు చూడండి.'],['బాధ్యతాయుత టెక్నాలజీ వినియోగం','ఆలోచించి పంచుకోండి, నిజాలు తనిఖీ చేయండి, స్క్రీన్ సమయాన్ని సమతుల్యం చేయండి.']],
        stats:[['100%','కమ్యూనిటీ సర్వేలు పూర్తి'],['450+','గ్రామస్థులకు మార్గదర్శనం'],['12','అవగాహన సమావేశాలు'],['4','ప్రాక్టికల్ లెర్నింగ్ మిషన్లు']],safetyBadge:'లైవ్ సిమ్యులేటర్',safetyCardTitle:'ఇంటరాక్టివ్ సైబర్ సేఫ్టీ స్క్రీన్',safetyCardCopy:'అత్యవసరంగా కనిపించే మెసేజ్ వచ్చినప్పుడు ఏమి చేయాలో సురక్షితంగా సాధన చేయండి. ఇందులో నిజమైన లింక్‌లు తెరుచుకోవు.',problemBadge:'సహాయ వేదిక',problemCardTitle:'సమస్యలు & పరిష్కారాల వేదిక',problemCardCopy:'గ్రామాల్లో తరచూ వచ్చే ఇంటర్నెట్ సమస్యలను మరియు ప్రశాంతమైన, ఆచరణాత్మక పరిష్కారాలను పక్కపక్కనే చూడండి.',
        glossEyebrow:'సరళ పదాల విభాగం',glossTitle:'సరళ భాష <span>నిఘంటువు టెర్మినల్</span>',glossCopy:'ఒక పదం నొక్కండి లేదా టైప్ చేసి Enter నొక్కండి. కష్టమైన ఆన్‌లైన్ పదాలను నిత్య జీవిత ఉదాహరణలతో అర్థం చేసుకోండి.',terminalLabel:'నిఘంటువు డీకోడర్ v3.0',termPrompt:'›› పదం రాయండి:',termDefault:'›› సిస్టమ్ సిద్ధంగా ఉంది. పైన పదాన్ని ఎంచుకోండి లేదా OTP, PHISHING, HTTPS, CLOUD, SPAM టైప్ చేయండి.',termUnknown:'›› పదం తెలియదు. OTP, Phishing, HTTPS, Cloud లేదా Spam ఎంచుకోండి.',terms:{OTP:'›› OTP = వన్-టైమ్ పాస్‌వర్డ్. ఇది ఒక తలుపుకు ఒకసారి మాత్రమే పని చేసే తాళంచెవి లాంటిది. బ్యాంకు వ్యక్తినని చెప్పేవారికీ దీన్ని ఎప్పుడూ చెప్పకండి.',Phishing:'›› ఫిషింగ్ = నకిలీ ఎర వేసే మెసేజ్. చేపను పట్టే ఎరలా, ఇది మీ పిన్, పాస్‌వర్డ్ లేదా వ్యక్తిగత వివరాలు పొందడానికి ప్రయత్నిస్తుంది. ఆగండి, తనిఖీ చేయండి, రిపోర్ట్ చేయండి.',HTTPS:'›› HTTPS = రక్షిత వెబ్‌సైట్ కనెక్షన్. ప్యాడ్‌లాక్ మరియు https సమాచారం ప్రయాణంలో రక్షించడంలో సహాయపడతాయి; అయినా వెబ్‌సైట్ అసలు పేరు తనిఖీ చేయాలి.',Cloud:'›› క్లౌడ్ = ఆన్‌లైన్ స్టోరేజ్ లాకర్. ఫోటోలు లేదా పత్రాల కాపీని సురక్షిత ఇంటర్నెట్ సర్వర్‌లో ఉంచి, మరో పరికరం నుండి కూడా చూడవచ్చు.',Spam:'›› స్పామ్ = అనవసరమైన లేదా తప్పుదోవ పట్టించే సందేశాలు. అడగకుండా వచ్చిన కరపత్రంలా భావించండి: సమాధానం ఇవ్వకండి, లింక్ తెరవకండి, డిలీట్ లేదా రిపోర్ట్ చేయండి.'},
        faqEyebrow:'త్వరిత సమాధానాలు',faqTitle:'గ్రామంలోని సాధారణ <span>ఇంటర్నెట్ ప్రశ్నలు</span>',faqCopy:'స్పష్టమైన, రోజువారీ సమాధానం కోసం ఒక ప్రశ్న తెరవండి.',faqs:[['ఒక ఆన్‌లైన్ లింక్ నిజంగా ప్రభుత్వానిదేనా అని ఎలా తెలుసుకోవాలి?','సెర్చ్ రిజల్ట్ లేదా మెసేజ్ అధికారికంగా కనిపించినంత మాత్రాన నమ్మకండి. విభాగం ధృవీకరించిన యాప్, అధికారిక సంప్రదింపు లేదా అధీకృత సేవా కేంద్రం నుండి ప్రారంభించండి. పూర్తి అడ్రస్ జాగ్రత్తగా చూడండి; “Sponsored” ప్రకటనలను దూరంగా ఉంచండి. సందేహం ఉంటే వివరాలు ఇవ్వకముందు సేవా కేంద్రంలో అడగండి।'],['డబ్బు పంపిన తర్వాత పేమెంట్ యాప్ ఆగిపోతే ఏమి చేయాలి?','మళ్లీ మళ్లీ “Pay” నొక్కకండి; రెండో పేమెంట్ ప్రారంభించకండి. కొద్దిసేపు ఆగి ట్రాన్సాక్షన్ హిస్టరీ చూడండి; రిఫరెన్స్ నంబర్ భద్రంగా ఉంచండి. స్టేటస్ మారకపోతే బ్యాంకు లేదా యాప్ అధికారిక సహాయ మార్గం ద్వారా సంప్రదించండి. సహాయం అడిగినా UPI PIN లేదా OTP చెప్పకండి।'],['1234 లాంటి సులభమైన PIN సురక్షితమేనా?','కాదు. 1234, 0000, పుట్టిన తేదీ లేదా అన్ని ఖాతాలకు ఒకే కోడ్ వాడకండి. పేమెంట్ యాప్‌కు వేరే ఊహించలేని PIN పెట్టండి, ఫోన్ లాక్/బయోమెట్రిక్ ఆన్ చేయండి మరియు ఇతరులు చూసే చోట PIN రాయకండి।']],toProblems:'సమస్యలు & పరిష్కారాలు చూడండి  →',
        problemsEyebrow:'నిజ జీవిత పరిస్థితులకు ప్రశాంత పరిష్కారాలు',problemsTitle:'గ్రామ ఇంటర్నెట్ <span>సమస్యలు & పరిష్కారాలు</span>',problemsCopy:'సాధారణ పరిస్థితులకు త్వరిత పక్కపక్క గైడ్. ఏదైనా అత్యవసరంగా అనిపిస్తే ముందుగా ఆగండి—తరువాత ఈ అడుగులు పాటించండి.',returnHome:'← హోమ్‌కు తిరిగి వెళ్ళండి',mitigation:'సులభమైన భద్రతా దశలు',inc:'సంఘటన',problems:[
          ['సెర్చ్ రిజల్ట్‌లలో నకిలీ వెబ్‌సైట్ లింకులు','రేషన్, భూమి లేదా లబ్ధుల సమాచారం కోసం చూస్తూ నకిలీ వెబ్‌సైట్ లేదా పెయిడ్ యాడ్ తెరవవచ్చు. అక్కడ వ్యక్తిగత వివరాలు తీసుకోవచ్చు.',['విభాగం అధికారిక యాప్, సురక్షిత బుక్‌మార్క్ లేదా అధీకృత సేవా కేంద్రం నుండే మొదలుపెట్టండి.','కేవలం లోగో లేదా మొదటి రిజల్ట్ కాకుండా పూర్తి వెబ్ అడ్రస్ చదవండి.','తెలియని పేజీలో ఆధార్, బ్యాంకు లేదా OTP వివరాలు పెట్టకండి.']],
          ['కరెంట్ లేదా పంప్ గురించి బెదిరింపు సందేశాలు','లింక్ తెరవకపోతే లేదా చెల్లించకపోతే గంటలో కనెక్షన్ కట్ అవుతుందని మెసేజ్ చెబుతుంది. భయం, తొందరపాటు మోసాల సాధారణ పద్ధతులు.',['లింక్ నొక్కకండి; మెసేజ్‌లోని నంబర్‌కు కాల్ చేయకండి.','బిల్లు కేవలం ప్రొవైడర్ అధికారిక యాప్, వెబ్‌సైట్ లేదా స్థానిక ఆఫీసులోనే తనిఖీ చేయండి.','స్క్రీన్‌షాట్ ఉంచి, సందేహాస్పద మెసేజ్‌ను రిపోర్ట్ చేయండి; ఫార్వర్డ్ చేయకండి.']],
          ['తక్కువ నెట్‌వర్క్‌లో పేమెంట్ పెండింగ్','స్క్రీన్ తిరుగుతూ ఉంటుంది, డబ్బు కట్ అయినట్టు కనిపిస్తుంది, కానీ దుకాణదారునికి చేరదు.',['మొదటి స్టేటస్ స్పష్టమయ్యే వరకు రెండో పేమెంట్ చేయకండి.','ట్రాన్సాక్షన్ హిస్టరీ చూసి UTR/రిఫరెన్స్ నంబర్ రాసుకోండి.','అవసరమైతే అధికారిక బ్యాంక్/యాప్ సహాయం తీసుకోండి; “సపోర్ట్”కి PIN లేదా OTP చెప్పకండి.']],
          ['బ్రోకర్ ఇచ్చే అనుమానాస్పద ప్రింటెడ్ రసీదు','అనధికార వ్యక్తి ఎక్కువ ఫీజు తీసుకుని ఫారం వేస్తానని చెబుతూ, అసలు సిస్టమ్‌కు చెందని రసీదు ఇవ్వవచ్చు.',['అధీకృత కేంద్రాలనే ఎంచుకోండి; సేవకు ముందు అధికారిక ఫీజు అడగండి.','అప్లికేషన్ నంబర్‌ను అధికారిక పోర్టల్ లేదా విభాగంలో మీరే తనిఖీ చేయండి.','ID పత్రాల కాపీలు లేదా ఖాతా PIN బ్రోకర్‌కు ఇవ్వకండి.']],
          ['అన్ని చోట్లా అదే సులభ PIN','సులభంగా లేదా పదేపదే వాడిన పాస్‌వర్డ్‌తో ఒకరు అనేక ఖాతాలకు చేరవచ్చు.',['పేమెంట్, ఈమెయిల్, సోషల్ ఖాతాలను వేర్వేరుగా ఉంచండి.','బలమైన ప్రత్యేక పాస్‌ఫ్రేజ్/PIN పెట్టి, వీలైతే బయోమెట్రిక్ లాక్ వాడండి.','షేర్‌డ్ కంప్యూటర్‌లో పాస్‌వర్డ్ సేవ్ చేయకండి; పూర్తిగా లాగౌట్ అవ్వండి.']]

        learnEyebrow:'కొత్తది · నేర్చుకోండి & సాధన చేయండి',learnTitle:'మీ రోజువారీ <span>డిజిటల్ లెర్నింగ్ ప్రయాణం</span>',learnCopy:'నాలుగు చిన్న మిషన్లు ఆన్‌లైన్ సేవలను అలవాటుగా మారుస్తాయి. చదవండి, చిన్న ప్రశ్నకు సమాధానం ఇవ్వండి, ప్రగతిని అన్‌లాక్ చేయండి. తొందర లేదు—వేగం కంటే అర్థం చేసుకోవడం ముఖ్యం.',progressMessage:'పూర్తి చేసిన మిషన్లు',moduleLabel:'మిషన్',stepsLabel:'ఈ సురక్షిత దశలు పాటించండి',smartSignal:'స్మార్ట్ సంకేతం',quickCheck:'త్వరిత తనిఖీ',answerFeedbackGood:'చాలా బాగుంది! ఈ మిషన్ పూర్తయింది. సురక్షిత డిజిటల్ అలవాట్లను పెంచుకుంటూ ఉండండి.',answerFeedbackTry:'ఇంకా కాదు. దశలను మరోసారి చదివి, అత్యంత సురక్షితమైన ఎంపిక ఎంచుకోండి.',nextMission:'తర్వాతి మిషన్ →',
        modules:[
          {title:'ఆన్‌లైన్ విద్య',hook:'సరైన మూలం ఎంచుకుని, చిన్న చదువు దినచర్య పెట్టుకుంటే ఫోన్ ఒక చిన్న తరగతి గదిగా మారుతుంది.',steps:[['నమ్మకమైన మూలంతో ప్రారంభించండి','సరైన యాప్, క్లాస్ లింక్ లేదా ఛానెల్ కోసం ఉపాధ్యాయుడు, స్కూల్ లేదా గుర్తింపు పొందిన విద్యా సంస్థను అడగండి.'],['విద్యార్థి ప్రొఫైల్‌ను రక్షించండి','తల్లిదండ్రుల అనుమతి ఉన్న ఖాతా వాడండి. పిల్లల ఫోటో, అడ్రస్, స్కూల్ ID లేదా క్లాస్ లింక్‌ను పబ్లిక్‌గా పెట్టకండి.'],['నేర్చుకున్నది గుర్తుండేలా చేయండి','వీలైతే పాఠాలను ఆఫ్‌లైన్ కోసం సేవ్ చేయండి. రోజూ చిన్న సమయం నిర్ణయించి, కొత్త విషయం ఒకటి కుటుంబంతో పంచుకోండి.']],signal:'నిజమైన లెర్నింగ్ సర్వీస్ ఎవరు నిర్వహిస్తున్నారో, ఖర్చు ఎంత, సహాయం ఎలా దొరుకుతుందో చెబుతుంది. “ఉద్యోగం గ్యారెంటీ” లేదా “వెంటనే సర్టిఫికేట్” ప్రకటనల పట్ల జాగ్రత్త.',question:'ఒక మెసేజ్ వ్యక్తిగత నంబర్‌కు డబ్బు పంపితే ఈరోజే సర్టిఫికేట్ ఇస్తానంటోంది. అత్యంత సురక్షితం ఏది?',options:['ఆఫర్ ముగిసేలోపు వెంటనే చెల్లించండి','టీచర్‌ను అడగండి / సంస్థ అధికారిక సంప్రదింపును వాడండి','స్నేహితులకు ఫార్వర్డ్ చేయండి'],correct:1},
          {title:'ప్రభుత్వ సేవలు',hook:'ప్రభుత్వ సేవలు ప్రయాణం, సమయం ఆదా చేయవచ్చు—కానీ అత్యవసర మెసేజ్ లేదా ప్రకటన కాకుండా ధృవీకరించిన మార్గం నుండే మొదలుపెట్టండి.',steps:[['ధృవీకరించిన మూలంతో మొదలుపెట్టండి','విభాగం అధికారిక యాప్, ధృవీకరించిన వెబ్‌సైట్ లేదా అధీకృత సేవా కేంద్రం వాడండి. మెసేజ్ లింక్‌కు బదులు అడ్రస్ టైప్ చేయండి లేదా నమ్మకమైన బుక్‌మార్క్ వాడండి.'],['చిన్న రికార్డ్ ఉంచండి','దరఖాస్తు తర్వాత రిఫరెన్స్ నంబర్, తేదీ, రసీదు భద్రంగా ఉంచండి. తర్వాత స్టేటస్ చూడటానికి ఉపయోగపడుతుంది.'],['సురక్షితంగా ముగించండి','షేర్‌డ్ కంప్యూటర్ వాడితే లాగౌట్ అవ్వండి. పత్రాలను DigiLocker లేదా వ్యక్తిగత సురక్షిత చోట ఉంచండి; పబ్లిక్ చాట్‌లలో కాదు.']],signal:'లబ్ధి “విడుదల” చేయడానికి నిజమైన ఆఫీసు OTP, UPI PIN లేదా స్క్రీన్ యాక్సెస్ అడగదు. అనుమానం ఉంటే విభాగం పబ్లిక్ నంబర్ ద్వారా ధృవీకరించండి.',question:'పథకానికి వ్యక్తిగత వివరాలు పెట్టే ముందు ఏమి చేయాలి?',options:['మొదటి Sponsored సెర్చ్ రిజల్ట్ తెరవండి','అధికారిక యాప్, ఆఫీసు లేదా తెలిసిన పబ్లిక్ కాంటాక్ట్ ద్వారా సేవను ధృవీకరించండి','ఉపయోగపడతారని కనిపించే చాట్ అకౌంట్‌కు పత్రాలు పంపండి'],correct:1},
          {title:'డిజిటల్ ఆరోగ్య సేవలు',hook:'ఆన్‌లైన్ ఆరోగ్య సాధనాలు నమ్మకమైన సమాచారం, అపాయింట్‌మెంట్ అందించవచ్చు—కానీ మీ ప్రైవేట్ ఆరోగ్య వివరాలకు కూడా భద్రత అవసరం.',steps:[['గుర్తింపు పొందిన ఆరోగ్య సేవ ఎంచుకోండి','అపాయింట్‌మెంట్, టెలి కన్సల్టేషన్ లేదా రికార్డుల కోసం తెలిసిన ఆసుపత్రి, ప్రభుత్వ ఆరోగ్య సేవ లేదా అర్హత కలిగిన వ్యక్తి సూచించిన సేవ ఎంచుకోండి.'],['అవసరమైనంత మాత్రమే పంచుకోండి','రిపోర్టులు, ప్రిస్క్రిప్షన్, ID ప్రైవేట్. ధృవీకరించిన క్లినిక్ ఛానెల్‌లో మాత్రమే పంపండి; తెలియని కాలర్ లేదా సోషల్ అకౌంట్‌కు కాదు.'],['నేరుగా చికిత్స అవసరం ఎప్పుడు తెలుసుకోండి','అత్యవసరం, తీవ్రమైన లక్షణాలు లేదా సందేహం ఉంటే స్థానిక ఆరోగ్య సేవ/అర్హత గల డాక్టర్‌ను కలవండి. ఇంటర్నెట్ మెసేజ్ నిర్ధారణ కాదు.']],signal:'ఒక ఫార్వర్డ్ మెసేజ్‌తో ప్రతీ వ్యాధి చెప్పగల నిజమైన సేవ ఉండదు. అద్భుత చికిత్స వీడియోలు, ధృవీకరించని మందుల విక్రేతలు, స్పష్టమైన సలహా ముందు డబ్బు అడిగేవారిని నివారించండి.',question:'“ఉచిత మందు” కోసం చాట్‌లో ప్రిస్క్రిప్షన్ ఫోటో పంపమని ఒక అపరిచితుడు అడిగాడు. అత్యంత సురక్షితం ఏది?',options:['ఆఫర్ ఉపయోగకరంగా ఉంది, ఫోటో పంపండి','ముందు మీ క్లినిక్ లేదా ఆరోగ్య కేంద్రం ద్వారా ధృవీకరించండి','పబ్లిక్ గ్రూప్‌లో ఫోటో పెట్టి అడగండి'],correct:1},
          {title:'తెలివైన వ్యవసాయం',hook:'వాతావరణం, ధరలు, వ్యవసాయ సలహా—నమ్మకమైన మూలం, స్థానిక పరిస్థితి, నిపుణుల సలహాతో పోల్చినప్పుడు చాలా ఉపయోగకరం.',steps:[['మూలం, తేదీ తనిఖీ చేయండి','ప్రభుత్వ వ్యవసాయ ఛానెల్స్, వ్యవసాయ విశ్వవిద్యాలయాలు, గుర్తింపు పొందిన మార్కెట్ సమాచారం లేదా స్థానిక విస్తరణ అధికారిని చూడండి. అప్‌డేట్ తేదీ చూడండి.'],['అమలు ముందు పోల్చండి','ఒక వీడియో చూసి విత్తనం, పురుగుమందు లేదా ఎరువు మార్చకండి. స్థానిక అధికారి, ఉత్పత్తి లేబుల్‌తో సలహాను పోల్చండి.'],['పొలం సమాచారం ప్రైవేట్‌గా ఉంచండి','నమ్మకమైన సలహాదారుకు అవసరమైనప్పుడు మాత్రమే పొలం ఫోటోలు పంపండి. ఆశ్చర్యకరమైన గ్రాంట్ ఇస్తామనేవారికి బ్యాంకు వివరాలు, భూమి పత్రాలు, OTP పంపకండి.']],signal:'మంచి వ్యవసాయ సలహాలో పంట, కాలం, ప్రాంతం, పరిమితులు ఉంటాయి. “ఒక్క రోజులో రెండింతల దిగుబడి” లేదా “సబ్సిడీకి ఇప్పుడే చెల్లించండి” హెచ్చరిక సంకేతాలు.',question:'ఏ మెసేజ్ పట్ల ఎక్కువ జాగ్రత్త అవసరం?',options:['స్థానిక వ్యవసాయ అధికారి ధృవీకరించిన తేదీతో సలహా','అడ్వాన్స్ పేమెంట్ కోరే “భారీ దిగుబడి గ్యారెంటీ” పోస్ట్','గుర్తింపు మూలంలో తనిఖీ చేసిన మార్కెట్ ధర'],correct:1}
        ],
        guides:[
          {title:'ఇంటర్నెట్ & డిజిటల్ ప్రాథమికాలు',sub:'ఫోన్, డేటా, గోప్యతను ఆరోగ్యంగా ఉంచే చిన్న అలవాట్లు.',dos:['వాడనప్పుడు మొబైల్ డేటా లేదా హాట్‌స్పాట్ ఆఫ్ చేయండి.','అధికారిక స్టోర్ నుండి డివైస్, యాప్ అప్‌డేట్‌లు పెట్టండి.','కొంత స్టోరేజ్ ఖాళీ ఉంచి, అవసరం లేని పాత ఫైళ్లు తొలగించండి.','స్క్రీన్ లాక్ వాడండి; అవసరం లేనప్పుడు Bluetooth ఆఫ్ చేయండి.'],donts:['తెలియని ఫైల్ లేదా లింక్ నుండి యాప్ ఇన్‌స్టాల్ చేయకండి.','పాస్‌వర్డ్ లేకుండా హాట్‌స్పాట్ ఎవరికీ ఇవ్వకండి.','వేడెక్కే లేదా విచిత్రంగా పనిచేసే ఫోన్‌ను నిర్లక్ష్యం చేయకండి.','తెలియని వారిని ముఖ్యమైన ఫోన్ సెట్టింగ్ మార్చనివ్వకండి.']},
          {title:'ఆన్‌లైన్ సేవలు & కమ్యూనికేషన్',sub:'మీ సమాచారంపై నియంత్రణతో మెసేజ్‌లు, కాల్‌లు, ఆన్‌లైన్ ఖాతాలను వాడండి.',dos:['అత్యవసర అభ్యర్థన నమ్మేముందు తెలిసిన మరో మార్గంలో కాంటాక్ట్ ధృవీకరించండి.','ప్రైవసీ సెట్టింగ్స్ వాడి, అధికారిక గ్రూప్ కాంటాక్ట్‌లు సేవ్ చేయండి.','డాక్టర్, విక్రేత, సేవా ప్రొవైడర్‌ను నమ్మకమైన మూలం ద్వారా తనిఖీ చేయండి.','మెసేజ్ ఫార్వర్డ్ చేయడానికి ముందు ఆగి ఆలోచించండి.'],donts:['మెడికల్ రిపోర్ట్, ID పత్రాలు, భూమి పేపర్లు తెలియని చాట్‌కు పంపకండి.','డబ్బు లేదా వివరాలు అడిగే రివార్డ్ గ్రూపులో చేరకండి.','తెలియని విదేశీ నంబర్ నుండి మళ్లీ మళ్లీ వచ్చే కాల్ ఎత్తకండి.','తెలియని అటాచ్‌మెంట్ డౌన్‌లోడ్ చేయకండి.']},
          {title:'సైబర్ భద్రత అవగాహన',sub:'భయపెట్టే కాల్స్, నకిలీ బహుమతులు, మోసపూరిత మెసేజ్‌లకు రక్షణ.',dos:['డబ్బు, OTP లేదా తక్షణ చర్య అడిగితే ఆగి ధృవీకరించండి.','సందేహాస్పద నంబర్లు, మెసేజ్‌లు బ్లాక్ & రిపోర్ట్ చేయండి.','SIM PIN, బలమైన స్క్రీన్ లాక్ పెట్టండి.','మోసం భయం ఉంటే బ్యాంక్ అధికారిక నంబర్ ద్వారా సంప్రదించండి.'],donts:['OTP, UPI PIN, కార్డ్ PIN, పాస్‌వర్డ్ ఎవరికీ చెప్పకండి.','మెసేజ్‌లోని చిన్న లేదా తెలియని లింకులు తెరవకండి.','కాలర్ చెప్పాడని స్క్రీన్ షేరింగ్/రిమోట్ కంట్రోల్ యాప్ పెట్టకండి.','బ్యాంకింగ్ లేదా ప్రైవేట్ పత్రాల కోసం ఓపెన్ Wi‑Fi వాడకండి.']},
          {title:'చెల్లింపులు & ఆన్‌లైన్ విద్య',sub:'సురక్షిత ట్రాన్స్‌ఫర్, నమ్మకమైన చదువు—రెండూ జాగ్రత్తగా తనిఖీ చేయడం నుండే మొదలవుతాయి.',dos:['పేమెంట్ అంగీకరించే ముందు అందుకునే వ్యక్తి పేరు తనిఖీ చేయండి.','పేమెంట్ పెండింగ్ అయితే ట్రాన్సాక్షన్ హిస్టరీ చూడండి.','టీచర్లు/సంస్థ సూచించిన నమ్మకమైన విద్యా వనరులు ఎంచుకోండి.','పేమెంట్ యాప్‌లకు వేర్వేరు సురక్షిత లాక్‌లు పెట్టండి.'],donts:['డబ్బు పొందడానికి ఎప్పుడూ UPI PIN ఎంటర్ చేయకండి.','తెలియని సోషల్ మీడియా యాడ్ నుండి కోర్సు కొనకండి.','బ్యాంకింగ్ చేస్తున్నప్పుడు స్క్రీన్ షేర్ చేయకండి.','పిల్లలను మార్గదర్శకం లేకుండా పేమెంట్లు చేయనివ్వకండి.']},
          {title:'ప్రభుత్వ ఆన్‌లైన్ సేవలు',sub:'లబ్ధులు, పత్రాలు, దరఖాస్తు స్థితి తనిఖీకి సురక్షిత మార్గం.',dos:['ధృవీకరించిన యాప్, కాంటాక్ట్ లేదా అధీకృత సేవా కేంద్రం నుండే ప్రారంభించండి.','అప్లికేషన్ నంబర్, రసీదులు భద్రంగా ఉంచండి.','షేర్‌డ్ కంప్యూటర్ నుండి పూర్తిగా లాగౌట్ అవ్వండి.','అందుబాటులో ఉంటే DigiLocker వంటి సురక్షిత డాక్యుమెంట్ వాలెట్ వాడండి.'],donts:['త్వరగా పని చేస్తానని చెప్పే అనధికార బ్రోకర్‌కు డబ్బు ఇవ్వకండి.','తనిఖీ చేయకుండా Sponsored సెర్చ్ యాడ్ నమ్మకండి.','పబ్లిక్ కంప్యూటర్‌లో బ్యాంక్ పాస్‌వర్డ్ సేవ్ చేయకండి.','భూమి పత్రాలు, అప్లికేషన్ నంబర్‌ను పబ్లిక్ గ్రూప్‌లో పెట్టకండి.']},
          {title:'బాధ్యతాయుత టెక్నాలజీ వినియోగం',sub:'సమాజం కోసం ఉపయోగకరమైన, దయగల, సమతుల్య డిజిటల్ దినచర్య నిర్మించండి.',dos:['ముఖ్యమైన వార్త పంచే ముందు నమ్మకమైన స్థానిక/అధికారిక మూలంలో చూడండి.','కుటుంబం, పని, విశ్రాంతి, వ్యవసాయం కోసం ఫోన్-ఫ్రీ సమయం పెట్టండి.','ద్వేషం, దూషణ లేదా స్కామ్ కంటెంట్ రిపోర్ట్ చేయండి.','ఇంటర్నెట్‌తో నేర్చుకోండి, సేవలు పొందండి, ఉపయోగకరమైన ఆలోచనలు కనుగొనండి.'],donts:['భద్రత, ఆరోగ్యం లేదా కమ్యూనిటీ గురించి పుకార్లు ఫార్వర్డ్ చేయకండి.','ఆన్‌లైన్‌లో దూషణ లేదా అవమానం చేయకండి.','అనుమతి లేకుండా ఇతరుల ఫోటో/వీడియో పంచుకోకండి.','నమ్మకమైన సలహా లేకుండా అద్భుత ఆరోగ్య/పంట వాదనలు నమ్మకండి.']}
        ],
        modalTitle:'బెదిరింపు సిమ్యులేషన్ మాడ్యూల్',modalCopy:'నమూనా మెసేజ్ చదివి అత్యంత సురక్షిత తదుపరి అడుగు ఎంచుకోండి. ఇది నేర్చుకోవడానికి మాత్రమే; ఇందులో అసలు లింక్ తెరుచుకోదు.',messageContainer:'మెసేజ్ తనిఖీ',simLive:'[ప్రాక్టీస్ మోడ్]',reportBtn:'🚨 స్కామ్‌గా రిపోర్ట్ చేయి',verifyBtn:'✓ అధికారిక యాప్‌తో తనిఖీ చేయి',simWait:'›› మీ నిర్ణయం కోసం వేచి ఉంది. తొందర, విచిత్రమైన లింక్, బహుమతి లేదా రహస్య కోడ్ అడగడాన్ని గమనించండి.',winReport:'›› మంచి నిర్ణయం. ఇది మోసంలా కనిపిస్తోంది. ఆధారం ఉంచి, పంపినవారిని బ్లాక్/రిపోర్ట్ చేసి, నిజమైన సేవ ద్వారా విడిగా ధృవీకరించండి.',badReport:'›› జాగ్రత్త: తనిఖీ లేకుండా ప్రతీ మెసేజ్ రిపోర్ట్ చేస్తే నిజమైన సమాచారం మిస్ అవుతుంది. మెసేజ్ లింక్ కాకుండా అధికారిక యాప్ లేదా కాంటాక్ట్ ద్వారా ధృవీకరించడం సురక్షిత అలవాటు.',winVerify:'›› మంచి నిర్ణయం. మెసేజ్ లింక్ నొక్కకండి; ప్రొవైడర్ అధికారిక యాప్ తెరవండి లేదా తెలిసిన అడ్రస్ మీరే టైప్ చేసి చూడండి.',badVerify:'›› ప్రమాద సంకేతం కనిపించింది. ఈ మెసేజ్‌ను అనుసరించకండి. ఇది భయం లేదా నకిలీ బహుమతితో తొందర పెడుతోంది.',scenarios:[{text:'హెచ్చరిక: మీ సబ్సిడీ ఖాతా 30 నిమిషాల్లో మూసివేయబడుతుంది. ఇప్పుడే చిన్న లింక్‌లో “వెరిఫికేషన్ ఫీజు” చెల్లించండి.',safe:false},{text:'సమాచారం: గ్రామీణ నెట్‌వర్క్ అప్‌డేట్ అందుబాటులో ఉంది. వివరాల కోసం మీ మొబైల్ ప్రొవైడర్ అధికారిక యాప్ తెరవండి లేదా బిల్లుపై ఉన్న కస్టమర్ కేర్ నంబర్ వాడండి.',safe:true},{text:'అభినందనలు! మీరు ₹50,000 గెలిచారు. బహుమతి కోసం వెంటనే ప్రాసెసింగ్ ఛార్జ్, OTP పంపండి.',safe:false}],footer:'© 2026 RURALNET SAFETY CENTER · గ్రామీణ డిజిటల్ అవగాహన కార్యక్రమం'
      }
    };


    /* Detailed, service-focused curriculum added in July 2026. */
    const detailedCurriculum = {"en":[{"title":"Online education: YouTube, DIKSHA & courses","hook":"A phone becomes a powerful classroom when you choose a reliable teacher, follow one small plan and learn actively—not only by watching videos.","steps":[["Choose the right learning source","For school lessons, ask your teacher for the class, chapter and language. On YouTube, prefer a known school, university, government education channel or teacher whose name and background you can check. On DIKSHA, textbooks can link to curriculum material through QR codes."],["Watch with a purpose","Before pressing play, write one question: “What do I need to learn?” Pause, make two notes, then try one example yourself. Save useful videos into a subject playlist; turn off autoplay when it pulls you away from the lesson."],["Protect time, data and privacy","Use Wi-Fi or download only where a platform legally offers offline viewing. Do not share a child’s name, address, school ID, class link or family phone number in comments, live chat or unknown study groups."]],"signal":"A good lesson clearly names its topic, teacher/source and date. A video that promises “guaranteed marks”, asks for payment to a personal number, or tells you to install an unknown app is a warning sign.","resources":[["DIKSHA — school learning","Digital textbooks, QR-linked material, question banks and learning resources for students, parents and teachers.","diksha.gov.in"],["SWAYAM — structured courses","Courses from recognised Indian institutions; read the course page for schedule, eligibility and any certificate/exam terms.","swayam.gov.in"],["YouTube — use it wisely","Use search filters, check the channel’s About page, date and sources; treat comments and adverts as opinions, not proof.","youtube.com"]],"note":"For a child, watch the first few videos together. Make a “learn, pause, practise, explain” routine: after a video, explain the idea to another person in your own words.","question":"A video claims it can guarantee exam marks if you pay a personal UPI number. What is the safest response?","options":["Pay quickly before the offer ends","Ask a teacher and use only a verified school/institution contact","Post your phone number in the comments"],"correct":1},{"title":"Government online services: start safely","hook":"Online services can save a trip, but the safest shortcut is always a verified starting point—not a sponsored search result or a message that creates fear.","steps":[["Begin at a known official route","Type a known official address yourself, use an official app, or visit an authorised service centre. In Andhra Pradesh, the state MeeSeva portal is a common starting point for many citizen services; check the exact service and fee before applying."],["Keep proof of every step","Before submitting, read the service name, documents requested and payment amount. Save the application/reference number, date, receipt and a screenshot of the final status. These records help if you need to follow up."],["Use shared devices carefully","At a centre or friend’s computer, do not allow the browser to save passwords. Log out, remove downloaded copies if appropriate, and take your papers with you. Never give an OTP, UPI PIN or remote-screen access to a helper."],["Verify a message separately","If a message says a certificate, ration, pension or subsidy will stop today, do not use its link. Open the official app/portal yourself or ask at the responsible local office."]],"signal":"A logo, a green tick, or a result at the top of Google is not enough proof. Fraud pages copy all of them. The full address, official contact route and a calm cross-check matter.","resources":[["AP MeeSeva","A state portal/service route for citizen applications and status checks. Enter the address yourself and compare the service details with an authorised centre if uncertain.","ap.meeseva.gov.in"],["PM-KISAN","Check farmer-benefit status only through the official portal/app or an authorised assistance point. eKYC and eligibility requirements can change, so read the current official notice.","pmkisan.gov.in"],["India portal","A directory for many central government services. Search within the official portal rather than trusting an advertisement.","india.gov.in"]],"note":"No genuine official service should need your UPI PIN or Aadhaar OTP from a random call, WhatsApp chat or screen-sharing app. Pay only after you independently verify the department, service and amount.","question":"You receive a “benefit ends today” WhatsApp link. What should you do first?","options":["Open it immediately to avoid losing the benefit","Use the official portal/app or local office independently to check","Forward it to all family groups"],"correct":1},{"title":"Aadhaar & DigiLocker: documents with care","hook":"Digital identity tools are useful when you understand what they do: verify through official channels, share the minimum needed, and keep OTPs private.","steps":[["Use UIDAI’s official routes only","For Aadhaar services, begin at UIDAI / MyAadhaar or the official mAadhaar app. e-Aadhaar can be downloaded through official UIDAI channels. Some online services need the mobile number already registered with Aadhaar."],["Know what needs a visit","Do not believe an agent who says every Aadhaar change can be made from a link. UIDAI states that mobile-number updates require an Aadhaar Enrolment Centre; check the current official rule for your required update before paying anyone."],["Use DigiLocker intelligently","In DigiLocker, distinguish an issuer-provided document from a file you uploaded yourself. An “Issued” document comes from the issuer; an uploaded image is your stored copy. Check what the receiving service actually accepts."],["Share the smallest necessary proof","Show a document only to a verified service. Never post Aadhaar images on public social media. Keep your phone locked and do not tell anyone your Aadhaar OTP, DigiLocker sign-in OTP, PIN or password."]],"signal":"Aadhaar is an identity document—not a secret password. The secret part is the OTP/PIN and the control of where you share your document. A caller demanding either is a stop sign.","resources":[["UIDAI / MyAadhaar","Official route for Aadhaar-related services, e-Aadhaar information, update guidance and enrolment-centre search.","uidai.gov.in · myaadhaar.uidai.gov.in"],["mAadhaar","UIDAI’s official mobile app. Use the genuine app-store listing; a registered mobile number is needed for many account functions.","mAadhaar (UIDAI app)"],["DigiLocker","A government-backed document wallet. Use it through the official website or official app—not a link sent by a stranger.","digilocker.gov.in"]],"note":"Before a document update or payment, pause and ask: “Which department is this? Why do they need this document? Can I enter the official address myself?” If you are unsure, take a trusted family member to an authorised centre.","question":"A caller says they need your Aadhaar OTP to “keep Aadhaar active.” What is the safest action?","options":["Tell the OTP because the caller knows your name","End the call; independently check through UIDAI or an authorised enrolment centre","Send an Aadhaar photo over WhatsApp first"],"correct":1},{"title":"Digital healthcare: records, appointments & trust","hook":"Online health tools can help with appointments, records and professional advice. They do not replace emergency care, a qualified examination or your own consent.","steps":[["Choose a recognised provider","Use a known hospital, government health service or qualified professional. Before a teleconsultation, confirm the provider’s name, clinic/hospital, consultation fee and how to contact the service again if needed."],["Keep health records private","Reports, prescriptions, health IDs and symptoms are sensitive. Share them only through a verified clinic channel. With ABHA-enabled services, consent to share records should be your choice; read what you are agreeing to and share only what is needed."],["Prepare for a useful consultation","Keep the patient’s age, symptoms, duration, allergies, current medicines and previous report ready. Write down the doctor’s advice, follow-up date and prescription. Do not self-medicate from a video or forwarded message."],["Know the emergency boundary","For severe breathing trouble, chest pain, heavy bleeding, unconsciousness, poisoning or another emergency, seek local emergency medical help immediately. Do not wait for a chat reply or online video."]],"signal":"A genuine clinician does not promise a miracle cure through a random social post. Be especially cautious when someone wants an advance payment, an OTP, your full medical report on social media, or asks you to stop prescribed treatment.","resources":[["eSanjeevani","Government telemedicine service. Availability and pathways may differ by state/facility; use the official site or your health centre to start.","esanjeevani.mohfw.gov.in"],["ABHA / ABDM","Digital-health framework where health-record sharing is based on your consent. Check the official site or a participating facility for current options.","abdm.gov.in"],["Your local health centre","For urgent symptoms, pregnancy care, child illness, vaccinations or medicine questions, a local qualified provider is often the best first contact.","Verified local contact"]],"note":"Online information can support a conversation with a clinician, but it cannot diagnose you. Never use a medicine, dose or treatment merely because it was popular in a video or forwarded in a group.","question":"A stranger requests your prescription in a public chat to arrange “free medicine.” What is safest?","options":["Upload it immediately","Verify the offer directly with your clinic or local health centre","Share it in every group to get more opinions"],"correct":1},{"title":"Smart agriculture: weather, markets & advice","hook":"Digital tools can help farmers compare prices, receive weather information and find schemes. The best decisions combine reliable online information with local conditions and trained advice.","steps":[["Check source, date and location","For weather or crop advice, look for the issuing organisation, the date and the district/crop it applies to. A video made for another climate, season or crop may not suit your field."],["Compare before spending","Before changing seed, fertiliser, pesticide or irrigation, compare information with an agriculture officer, KVK/extension worker, input label and local experience. Never pay a social-media seller because of “double yield guaranteed.”"],["Use market information as one input","e-NAM and recognised mandi information can help compare prices and market activity. Confirm the crop grade, unit, transport cost and local mandi process before making a selling decision."],["Check scheme updates safely","For PM-KISAN or another benefit, use the official portal/app or authorised assistance point. Do not pay an agent who promises to “activate” a benefit, and never share OTP/PIN in the name of eKYC."]],"signal":"Useful farming advice identifies the crop, growth stage, local condition and limits. A message that promises instant subsidy, huge yield or magic medicine while asking for a payment is designed to rush you.","resources":[["e-NAM","National Agriculture Market information and mandi-linked trading ecosystem. Learn the local mandi procedure before relying on an online offer.","enam.gov.in"],["PM-KISAN","Official portal for scheme information/status. Eligibility and eKYC requirements must be checked from the latest official notice.","pmkisan.gov.in"],["Local agriculture support","Your agricultural officer, KVK, recognised cooperative or authorised input adviser can help interpret online advice for your soil and crop.","Verify locally"]],"note":"Never mix pesticides or change dosage from a short video. Follow the product label and qualified local advice, use protective measures, and keep children away from farm chemicals.","question":"Which farming message should make you stop and verify?","options":["A dated advisory that a local agriculture officer confirms","“Pay now—double yield is guaranteed tomorrow”","A local weather update checked on a recognised source"],"correct":1}],"hi":[{"title":"ऑनलाइन शिक्षा: YouTube, DIKSHA और कोर्स","hook":"सही शिक्षक चुनकर, छोटी योजना बनाकर और केवल वीडियो देखने के बजाय अभ्यास करके फोन एक प्रभावी कक्षा बन सकता है।","steps":[["सही सीखने का स्रोत चुनें","स्कूल पाठ के लिए शिक्षक से सही कक्षा, अध्याय और भाषा पूछें। YouTube पर जाने-माने स्कूल, विश्वविद्यालय, सरकारी शिक्षा चैनल या ऐसे शिक्षक को चुनें जिनका परिचय जांच सकें। DIKSHA में किताबों के QR कोड से पाठ्यक्रम सामग्री मिल सकती है।"],["उद्देश्य के साथ देखें","वीडियो चलाने से पहले एक सवाल लिखें—“मुझे क्या सीखना है?” बीच में रोककर दो नोट बनाएं और एक उदाहरण खुद हल करें। उपयोगी वीडियो को विषय प्लेलिस्ट में रखें; पढ़ाई से भटकाने वाला autoplay बंद करें।"],["समय, डेटा और निजता बचाएं","जहां प्लेटफॉर्म कानूनी ऑफलाइन सुविधा दे वहीं डाउनलोड करें। बच्चे का नाम, पता, स्कूल ID, क्लास लिंक या परिवार का फोन नंबर कमेंट, लाइव चैट या अनजान पढ़ाई समूह में न डालें।"]],"signal":"अच्छे पाठ में विषय, शिक्षक/स्रोत और तारीख साफ होती है। “पक्के अंक”, निजी नंबर पर भुगतान, या अनजान ऐप इंस्टॉल कराने वाला वीडियो चेतावनी है।","resources":[["DIKSHA — स्कूल अध्ययन","छात्र, अभिभावक और शिक्षक के लिए डिजिटल किताबें, QR-लिंक सामग्री, प्रश्न बैंक और सीखने के साधन।","diksha.gov.in"],["SWAYAM — व्यवस्थित कोर्स","मान्य भारतीय संस्थानों के कोर्स; समय, योग्यता और सर्टिफिकेट/परीक्षा नियम कोर्स पेज पर पढ़ें।","swayam.gov.in"],["YouTube — समझदारी से उपयोग","चैनल का About पेज, तारीख और स्रोत जांचें; कमेंट और विज्ञापन को प्रमाण न मानें।","youtube.com"]],"note":"बच्चे के साथ शुरुआती वीडियो देखें। “सीखो, रोककर सोचो, अभ्यास करो, समझाओ” नियम अपनाएं: वीडियो के बाद उसे अपने शब्दों में किसी को समझाएं।","question":"एक वीडियो निजी UPI नंबर पर पैसे भेजने पर पक्के अंक दिलाने का दावा करता है। सबसे सुरक्षित क्या है?","options":["ऑफर खत्म होने से पहले भुगतान करें","शिक्षक से पूछें और केवल सत्यापित स्कूल/संस्था संपर्क का उपयोग करें","कमेंट में अपना फोन नंबर डालें"],"correct":1},{"title":"सरकारी ऑनलाइन सेवाएं: सुरक्षित शुरुआत","hook":"ऑनलाइन सेवाएं यात्रा बचा सकती हैं, लेकिन सुरक्षित शॉर्टकट हमेशा सत्यापित शुरुआत है—Sponsored सर्च रिजल्ट या डराने वाले संदेश नहीं।","steps":[["ज्ञात आधिकारिक माध्यम से शुरू करें","सही सरकारी पता खुद टाइप करें, आधिकारिक ऐप इस्तेमाल करें, या अधिकृत सेवा केंद्र जाएं। आंध्र प्रदेश में कई नागरिक सेवाओं के लिए MeeSeva आम माध्यम है; आवेदन से पहले सेवा और शुल्क जांचें।"],["हर चरण का प्रमाण रखें","भेजने से पहले सेवा का नाम, मांगे दस्तावेज और राशि पढ़ें। आवेदन/रेफरेंस नंबर, तारीख, रसीद और अंतिम स्थिति का स्क्रीनशॉट सुरक्षित रखें।"],["साझा डिवाइस सावधानी से चलाएं","केंद्र या किसी अन्य कंप्यूटर पर ब्राउज़र को पासवर्ड सेव न करने दें। लॉग आउट करें, जरूरत हो तो डाउनलोड कॉपी हटाएं और कागज साथ लें। सहायक को OTP, UPI PIN या स्क्रीन एक्सेस न दें।"],["संदेश की अलग से जांच करें","यदि संदेश कहता है कि आज ही पेंशन, राशन, प्रमाणपत्र या सब्सिडी बंद होगी, उसका लिंक न खोलें। खुद आधिकारिक ऐप/पोर्टल खोलें या जिम्मेदार कार्यालय से पूछें।"]],"signal":"लोगो, हरा टिक या Google का सबसे ऊपर दिखता रिजल्ट प्रमाण नहीं है। फ्रॉड पेज इन्हें कॉपी कर सकते हैं। पूरा पता, आधिकारिक संपर्क और शांत जांच जरूरी है।","resources":[["AP MeeSeva","नागरिक आवेदन और स्टेटस जांचने का राज्य माध्यम। पता खुद टाइप करें और संदेह हो तो अधिकृत केंद्र से सेवा विवरण मिलाएं।","ap.meeseva.gov.in"],["PM-KISAN","किसान लाभ स्थिति केवल आधिकारिक पोर्टल/ऐप या अधिकृत सहायता बिंदु से देखें। eKYC और पात्रता नियम बदल सकते हैं।","pmkisan.gov.in"],["India portal","कई केंद्रीय सरकारी सेवाओं की निर्देशिका। विज्ञापन पर भरोसा करने के बजाय आधिकारिक पोर्टल में खोजें।","india.gov.in"]],"note":"कोई असली सरकारी सेवा WhatsApp, अनजान कॉल या स्क्रीन-शेयरिंग ऐप पर आपका UPI PIN या Aadhaar OTP नहीं मांगेगी। विभाग, सेवा और राशि स्वतंत्र रूप से जांचकर ही भुगतान करें।","question":"WhatsApp पर “लाभ आज खत्म” लिंक आए तो पहले क्या करें?","options":["लाभ बचाने के लिए तुरंत खोलें","आधिकारिक पोर्टल/ऐप या स्थानीय कार्यालय से खुद जांचें","सभी परिवार समूहों में आगे भेजें"],"correct":1},{"title":"Aadhaar और DigiLocker: दस्तावेजों की समझदारी","hook":"डिजिटल पहचान टूल तभी उपयोगी हैं जब आप जानें कि क्या साझा करना है: केवल आधिकारिक माध्यम से सत्यापन करें और OTP निजी रखें।","steps":[["केवल UIDAI के आधिकारिक माध्यम अपनाएं","Aadhaar सेवाओं के लिए UIDAI / MyAadhaar या आधिकारिक mAadhaar ऐप से शुरू करें। e-Aadhaar आधिकारिक UIDAI माध्यम से डाउनलोड किया जा सकता है। कई ऑनलाइन सेवाओं के लिए Aadhaar में पहले से दर्ज मोबाइल जरूरी होता है।"],["किस काम के लिए केंद्र जाना है, जानें","उस एजेंट पर भरोसा न करें जो कहे कि हर Aadhaar बदलाव लिंक से हो सकता है। UIDAI के अनुसार मोबाइल नंबर बदलने के लिए Aadhaar Enrolment Centre जाना होता है; भुगतान से पहले अपनी जरूरत का ताजा आधिकारिक नियम देखें।"],["DigiLocker को समझकर चलाएं","DigiLocker में जारी (Issued) दस्तावेज और आपके अपलोड किए हुए दस्तावेज अलग होते हैं। Issued दस्तावेज जारीकर्ता से आता है; अपलोड की हुई फोटो आपकी संग्रहीत कॉपी है। पाने वाली सेवा क्या स्वीकार करती है, जरूर जांचें।"],["कम से कम जरूरी प्रमाण साझा करें","दस्तावेज केवल सत्यापित सेवा को दिखाएं। Aadhaar फोटो सोशल मीडिया पर न डालें। फोन लॉक रखें और Aadhaar OTP, DigiLocker OTP, PIN या पासवर्ड किसी को न बताएं।"]],"signal":"Aadhaar पहचान दस्तावेज है, गुप्त पासवर्ड नहीं। OTP/PIN और आप कहां दस्तावेज साझा करते हैं, यही गोपनीय है। इन्हें मांगने वाला कॉलर रुकने का संकेत है।","resources":[["UIDAI / MyAadhaar","Aadhaar सेवाएं, e-Aadhaar जानकारी, अपडेट मार्गदर्शन और enrolment-centre खोज का आधिकारिक माध्यम।","uidai.gov.in · myaadhaar.uidai.gov.in"],["mAadhaar","UIDAI का आधिकारिक मोबाइल ऐप। असली ऐप-स्टोर लिस्टिंग चुनें; कई कामों के लिए पंजीकृत मोबाइल नंबर जरूरी है।","mAadhaar (UIDAI app)"],["DigiLocker","सरकारी दस्तावेज वॉलेट। केवल आधिकारिक वेबसाइट या ऐप से चलाएं, अनजान के भेजे लिंक से नहीं।","digilocker.gov.in"]],"note":"अपडेट या भुगतान से पहले पूछें: “यह कौन-सा विभाग है? इन्हें यह दस्तावेज क्यों चाहिए? क्या मैं आधिकारिक पता खुद लिख सकता/सकती हूं?” संदेह हो तो भरोसेमंद व्यक्ति के साथ अधिकृत केंद्र जाएं।","question":"कॉलर कहता है Aadhaar चालू रखने के लिए OTP चाहिए। सबसे सुरक्षित क्या है?","options":["उसे OTP दे दें क्योंकि नाम पता है","कॉल बंद करें; UIDAI या अधिकृत enrolment centre से खुद जांचें","पहले WhatsApp पर Aadhaar फोटो भेजें"],"correct":1},{"title":"डिजिटल स्वास्थ्य सेवा: रिकॉर्ड, अपॉइंटमेंट और भरोसा","hook":"ऑनलाइन स्वास्थ्य साधन अपॉइंटमेंट, रिकॉर्ड और पेशेवर सलाह में मदद कर सकते हैं। वे आपातकाल, योग्य जांच या आपकी सहमति का स्थान नहीं लेते।","steps":[["मान्य प्रदाता चुनें","जाने-माने अस्पताल, सरकारी स्वास्थ्य सेवा या योग्य प्रोफेशनल का उपयोग करें। टेली-कंसल्टेशन से पहले प्रदाता/क्लिनिक का नाम, शुल्क और दोबारा संपर्क का तरीका जांचें।"],["स्वास्थ्य रिकॉर्ड निजी रखें","रिपोर्ट, पर्ची, हेल्थ ID और लक्षण संवेदनशील हैं। केवल सत्यापित क्लिनिक माध्यम से साझा करें। ABHA वाली सेवा में रिकॉर्ड साझा करने की सहमति आपकी होनी चाहिए; आप क्या मंजूर कर रहे हैं पढ़ें।"],["उपयोगी कंसल्टेशन की तैयारी करें","उम्र, लक्षण, कितने समय से हैं, एलर्जी, दवाएं और पुरानी रिपोर्ट तैयार रखें। डॉक्टर की सलाह, फॉलो-अप तारीख और पर्ची लिखें। वीडियो/फॉरवर्ड से खुद दवा न लें।"],["आपातकाल की सीमा जानें","सांस की तेज तकलीफ, छाती दर्द, बहुत खून, बेहोशी, जहर या आपातकाल में तुरंत स्थानीय चिकित्सा सहायता लें। चैट जवाब की प्रतीक्षा न करें।"]],"signal":"सच्चा चिकित्सक रैंडम पोस्ट में चमत्कारी इलाज का वादा नहीं करता। एडवांस भुगतान, OTP, सोशल मीडिया पर पूरी रिपोर्ट या निर्धारित इलाज रोकने को कहने वालों से सावधान रहें।","resources":[["eSanjeevani","सरकारी टेलीमेडिसिन सेवा। राज्य/केंद्र के अनुसार उपलब्धता बदल सकती है; आधिकारिक साइट या स्वास्थ्य केंद्र से शुरू करें।","esanjeevani.mohfw.gov.in"],["ABHA / ABDM","सहमति आधारित डिजिटल स्वास्थ्य व्यवस्था। मौजूदा विकल्प के लिए आधिकारिक साइट या भाग लेने वाली सुविधा से जांचें।","abdm.gov.in"],["स्थानीय स्वास्थ्य केंद्र","गंभीर लक्षण, गर्भावस्था, बच्चे की बीमारी, टीकाकरण या दवा प्रश्न में योग्य स्थानीय प्रदाता सबसे अच्छा पहला संपर्क हो सकता है।","सत्यापित स्थानीय संपर्क"]],"note":"ऑनलाइन जानकारी डॉक्टर से बातचीत में मदद करती है, निदान नहीं करती। लोकप्रिय वीडियो या फॉरवर्ड देखकर दवा, खुराक या इलाज न बदलें।","question":"अजनबी “मुफ्त दवा” के लिए पब्लिक चैट में पर्ची मांगता है। क्या करें?","options":["तुरंत अपलोड करें","अपने क्लिनिक या स्वास्थ्य केंद्र से सीधे सत्यापित करें","अधिक राय के लिए हर समूह में भेजें"],"correct":1},{"title":"स्मार्ट कृषि: मौसम, मंडी और सलाह","hook":"डिजिटल साधन कीमत, मौसम और योजना की जानकारी दे सकते हैं। सबसे अच्छा फैसला भरोसेमंद ऑनलाइन जानकारी, स्थानीय स्थिति और प्रशिक्षित सलाह को मिलाकर बनता है।","steps":[["स्रोत, तारीख और जगह जांचें","मौसम या फसल सलाह में जारी करने वाला संगठन, तारीख और जिला/फसल देखें। दूसरे मौसम या क्षेत्र के लिए बना वीडियो आपके खेत पर सही नहीं हो सकता।"],["खर्च से पहले तुलना करें","बीज, खाद, कीटनाशक या सिंचाई बदलने से पहले कृषि अधिकारी, KVK/extension worker, उत्पाद लेबल और स्थानीय अनुभव से जानकारी मिलाएं। “दोगुनी उपज पक्की” सोशल विक्रेता को पैसे न दें।"],["मंडी जानकारी को एक इनपुट की तरह लें","e-NAM और मान्य मंडी जानकारी से कीमत और बाजार गतिविधि तुलना की जा सकती है। बेचने से पहले फसल ग्रेड, इकाई, ढुलाई खर्च और स्थानीय मंडी प्रक्रिया की पुष्टि करें।"],["योजना की जानकारी सुरक्षित तरीके से देखें","PM-KISAN या दूसरी योजना के लिए आधिकारिक पोर्टल/ऐप या अधिकृत सहायता लें। लाभ “चालू” कराने वाले एजेंट को पैसे न दें और eKYC के नाम पर OTP/PIN न बताएं।"]],"signal":"उपयोगी कृषि सलाह में फसल, अवस्था, स्थानीय स्थिति और सीमाएं होती हैं। तुरंत सब्सिडी, बहुत बड़ी उपज या जादुई दवा का दावा करके भुगतान मांगने वाला संदेश जल्दबाजी कराने के लिए है।","resources":[["e-NAM","राष्ट्रीय कृषि बाजार जानकारी व मंडी-आधारित ट्रेडिंग व्यवस्था। ऑनलाइन ऑफर मानने से पहले स्थानीय मंडी प्रक्रिया जानें।","enam.gov.in"],["PM-KISAN","योजना जानकारी/स्टेटस का आधिकारिक पोर्टल। नवीनतम नोटिस में पात्रता और eKYC नियम जांचें।","pmkisan.gov.in"],["स्थानीय कृषि सहायता","कृषि अधिकारी, KVK, मान्य सहकारी संस्था या अधिकृत इनपुट सलाहकार ऑनलाइन सलाह को आपके खेत के अनुसार समझा सकते हैं।","स्थानीय सत्यापन"]],"note":"छोटे वीडियो देखकर कीटनाशक न मिलाएं और न खुराक बदलें। उत्पाद लेबल, योग्य स्थानीय सलाह और सुरक्षा उपाय मानें; बच्चों को रसायनों से दूर रखें।","question":"कौन-सा खेती संदेश रोककर जांचना चाहिए?","options":["स्थानीय कृषि अधिकारी द्वारा पुष्टि की तारीख वाला संदेश","“अभी भुगतान करें—कल दोगुनी उपज पक्की”","मान्य स्रोत पर जांचा गया स्थानीय मौसम अपडेट"],"correct":1}],"te":[{"title":"ఆన్‌లైన్ విద్య: YouTube, DIKSHA & కోర్సులు","hook":"సరైన టీచర్ ఎంచుకుని, చిన్న ప్లాన్ చేసుకుని, వీడియోలు చూడటంతో ఆగకుండా సాధన చేస్తే ఫోన్ శక్తివంతమైన తరగతి గదిగా మారుతుంది.","steps":[["సరైన విద్యా మూలం ఎంచుకోండి","స్కూల్ పాఠానికి సరైన క్లాస్, చాప్టర్, భాషను టీచర్‌ను అడగండి. YouTubeలో తెలిసిన స్కూల్, యూనివర్సిటీ, ప్రభుత్వ విద్యా ఛానల్ లేదా పరిచయాన్ని తనిఖీ చేయగల టీచర్‌ను ఎంచుకోండి. DIKSHAలో పుస్తకాల QR కోడ్‌ల ద్వారా పాఠ్యాంశాలు దొరకవచ్చు."],["లక్ష్యంతో చూడండి","వీడియో ప్రారంభించే ముందు ఒక ప్రశ్న రాయండి—“నేను ఏమి నేర్చుకోవాలి?” మధ్యలో ఆపి రెండు నోట్స్ రాసి, ఒక ఉదాహరణను మీరే ప్రయత్నించండి. ఉపయోగకరమైన వీడియోలను సబ్జెక్ట్ ప్లేలిస్ట్‌లో సేవ్ చేయండి; చదువు నుండి దూరం చేసే autoplay ఆఫ్ చేయండి."],["సమయం, డేటా, గోప్యత కాపాడండి","ప్లాట్‌ఫాం చట్టబద్ధమైన ఆఫ్‌లైన్ సౌకర్యం ఇస్తేనే డౌన్‌లోడ్ చేయండి. పిల్లల పేరు, అడ్రస్, స్కూల్ ID, క్లాస్ లింక్, కుటుంబ ఫోన్ నంబర్‌ను కామెంట్, లైవ్ చాట్ లేదా తెలియని స్టడీ గ్రూప్‌లో పెట్టకండి."]],"signal":"మంచి పాఠంలో టాపిక్, టీచర్/మూలం, తేదీ స్పష్టంగా ఉంటాయి. “మార్కులు గ్యారెంటీ”, వ్యక్తిగత నంబర్‌కు పేమెంట్ లేదా తెలియని యాప్ ఇన్‌స్టాల్ చేయమనే వీడియో హెచ్చరిక.","resources":[["DIKSHA — స్కూల్ లెర్నింగ్","విద్యార్థులు, తల్లిదండ్రులు, టీచర్లకు డిజిటల్ పుస్తకాలు, QR-లింక్ కంటెంట్, ప్రశ్న బ్యాంకులు, లెర్నింగ్ వనరులు.","diksha.gov.in"],["SWAYAM — నిర్మిత కోర్సులు","గుర్తింపు పొందిన భారతీయ సంస్థల కోర్సులు; షెడ్యూల్, అర్హత, సర్టిఫికేట్/పరీక్ష నిబంధనలు చదవండి.","swayam.gov.in"],["YouTube — తెలివిగా వాడండి","చానల్ About పేజీ, తేదీ, మూలాలు చూడండి; కామెంట్లు, యాడ్‌లను సాక్ష్యంగా భావించకండి.","youtube.com"]],"note":"పిల్లలతో మొదటి కొన్ని వీడియోలు కలిసి చూడండి. “నేర్చుకోండి, ఆపి ఆలోచించండి, సాధన చేయండి, వివరించండి” పద్ధతి పాటించండి: వీడియో తర్వాత తన మాటల్లో మరొకరికి చెప్పనివ్వండి.","question":"వ్యక్తిగత UPI నంబర్‌కు డబ్బు పంపితే పక్కా మార్కులు ఇస్తానని వీడియో చెబుతోంది. సురక్షితం ఏది?","options":["ఆఫర్ ముగిసేలోపు చెల్లించండి","టీచర్‌ను అడిగి, ధృవీకరించిన స్కూల్/సంస్థ కాంటాక్ట్ మాత్రమే వాడండి","కామెంట్‌లో మీ ఫోన్ నంబర్ పెట్టండి"],"correct":1},{"title":"ప్రభుత్వ ఆన్‌లైన్ సేవలు: సురక్షిత ప్రారంభం","hook":"ఆన్‌లైన్ సేవలు ప్రయాణం ఆదా చేస్తాయి; కానీ Sponsored సెర్చ్ రిజల్ట్ లేదా భయపెట్టే మెసేజ్ కాకుండా ధృవీకరించిన మార్గం నుండే ప్రారంభించడం సురక్షితం.","steps":[["తెలిసిన అధికారిక మార్గం నుండే ప్రారంభించండి","సరైన ప్రభుత్వ అడ్రస్ మీరే టైప్ చేయండి, అధికారిక యాప్ వాడండి లేదా అధీకృత సేవా కేంద్రానికి వెళ్ళండి. ఆంధ్రప్రదేశ్‌లో అనేక పౌర సేవలకు MeeSeva ఒక సాధారణ మార్గం; దరఖాస్తు ముందు సర్వీస్, ఫీజు తనిఖీ చేయండి."],["ప్రతి దశకు ఆధారం ఉంచండి","సబ్మిట్ చేసే ముందు సర్వీస్ పేరు, కావాల్సిన పత్రాలు, చెల్లింపు మొత్తం చదవండి. అప్లికేషన్/రిఫరెన్స్ నంబర్, తేదీ, రసీదు, చివరి స్టేటస్ స్క్రీన్‌షాట్ సేవ్ చేయండి."],["షేర్‌డ్ డివైస్ జాగ్రత్తగా వాడండి","సెంటర్ లేదా ఇతరుల కంప్యూటర్‌లో బ్రౌజర్ పాస్‌వర్డ్ సేవ్ చేయనివ్వకండి. లాగౌట్ అయి, అవసరమైతే డౌన్‌లోడ్ కాపీలు తొలగించి, పత్రాలు తీసుకెళ్ళండి. సహాయకుడికి OTP, UPI PIN, స్క్రీన్ యాక్సెస్ ఇవ్వకండి."],["మెసేజ్‌ను విడిగా తనిఖీ చేయండి","ఈరోజే రేషన్, పింఛన్, సర్టిఫికేట్ లేదా సబ్సిడీ ఆగిపోతుందని మెసేజ్ చెబితే దాని లింక్ నొక్కకండి. అధికారిక యాప్/పోర్టల్ మీరే తెరవండి లేదా సంబంధిత ఆఫీసులో అడగండి."]],"signal":"లోగో, గ్రీన్ టిక్ లేదా Googleలో పై రిజల్ట్ సాక్ష్యం కాదు. మోసపూరిత పేజీలు వాటిని కాపీ చేస్తాయి. పూర్తి అడ్రస్, అధికారిక కాంటాక్ట్, ప్రశాంత తనిఖీ ముఖ్యం.","resources":[["AP MeeSeva","పౌర దరఖాస్తులు, స్టేటస్ తనిఖీకి రాష్ట్ర మార్గం. అడ్రస్ మీరే టైప్ చేసి, సందేహం ఉంటే అధీకృత కేంద్రంతో సర్వీస్ వివరాలు పోల్చండి.","ap.meeseva.gov.in"],["PM-KISAN","రైతు లబ్ధి స్టేటస్‌ను అధికారిక పోర్టల్/యాప్ లేదా అధీకృత సహాయం ద్వారా మాత్రమే చూడండి. eKYC, అర్హత నియమాలు మారవచ్చు.","pmkisan.gov.in"],["India portal","అనేక కేంద్ర ప్రభుత్వ సేవల డైరెక్టరీ. యాడ్‌ను నమ్మకండి; అధికారిక పోర్టల్‌లోనే వెతకండి.","india.gov.in"]],"note":"ఏ నిజమైన ప్రభుత్వ సర్వీసూ WhatsApp, తెలియని కాల్ లేదా స్క్రీన్ షేరింగ్ యాప్‌లో మీ UPI PIN లేదా Aadhaar OTP అడగదు. డిపార్ట్‌మెంట్, సర్వీస్, మొత్తం స్వతంత్రంగా తనిఖీ చేసి మాత్రమే చెల్లించండి.","question":"WhatsAppలో “లబ్ధి ఈరోజే ముగుస్తుంది” లింక్ వస్తే మొదట ఏమి చేయాలి?","options":["లబ్ధి కోసం వెంటనే తెరవండి","అధికారిక పోర్టల్/యాప్ లేదా స్థానిక ఆఫీసులో మీరే తనిఖీ చేయండి","అన్ని ఫ్యామిలీ గ్రూపులకు ఫార్వర్డ్ చేయండి"],"correct":1},{"title":"Aadhaar & DigiLocker: పత్రాలను జాగ్రత్తగా వాడండి","hook":"డిజిటల్ గుర్తింపు టూల్స్‌లో ఏమి పంచుకోవాలో తెలిసినప్పుడే అవి ఉపయోగకరం: అధికారిక మార్గంలోనే ధృవీకరించండి, OTPని ప్రైవేట్‌గా ఉంచండి.","steps":[["UIDAI అధికారిక మార్గాలనే వాడండి","Aadhaar సేవలకు UIDAI / MyAadhaar లేదా అధికారిక mAadhaar యాప్ ద్వారా మొదలుపెట్టండి. అధికారిక UIDAI మార్గం నుంచి e-Aadhaar డౌన్‌లోడ్ చేయవచ్చు. అనేక ఆన్‌లైన్ సేవలకు Aadhaarలో ఇప్పటికే రిజిస్టర్ అయిన మొబైల్ అవసరం."],["ఏ పనికి సెంటర్‌కు వెళ్ళాలో తెలుసుకోండి","ప్రతి Aadhaar మార్పును లింక్‌లో చేస్తాననే ఏజెంట్‌ను నమ్మకండి. UIDAI ప్రకారం మొబైల్ నంబర్ అప్‌డేట్‌కు Aadhaar Enrolment Centre అవసరం; డబ్బు చెల్లించే ముందు మీ అప్‌డేట్‌కు తాజా అధికారిక నియమం తనిఖీ చేయండి."],["DigiLockerను అర్థం చేసుకుని వాడండి","DigiLockerలో Issued పత్రం, మీరు Upload చేసిన పత్రం వేరేవేరు. Issued పత్రం జారీదారు నుంచి వస్తుంది; అప్లోడ్ చేసిన ఫోటో మీరు దాచుకున్న కాపీ. తీసుకునే సర్వీస్ ఏది అంగీకరిస్తుందో చూడండి."],["అవసరమైనంత మాత్రమే పంచుకోండి","పత్రాన్ని ధృవీకరించిన సర్వీస్‌కే చూపండి. Aadhaar ఇమేజ్‌ను సోషల్ మీడియాలో పెట్టకండి. ఫోన్ లాక్‌లో ఉంచి, Aadhaar OTP, DigiLocker OTP, PIN, పాస్‌వర్డ్ ఎవరికీ చెప్పకండి."]],"signal":"Aadhaar గుర్తింపు పత్రం; రహస్య పాస్‌వర్డ్ కాదు. OTP/PIN, ఎక్కడ పత్రం పంచుతున్నారో రహస్యం. వాటిని అడిగే కాలర్‌కు ఆగండి.","resources":[["UIDAI / MyAadhaar","Aadhaar సేవలు, e-Aadhaar సమాచారం, అప్‌డేట్ గైడెన్స్, enrolment centre వెతకడానికి అధికారిక మార్గం.","uidai.gov.in · myaadhaar.uidai.gov.in"],["mAadhaar","UIDAI అధికారిక మొబైల్ యాప్. నిజమైన యాప్-స్టోర్ లిస్టింగ్ ఎంచుకోండి; అనేక ఫీచర్లకు రిజిస్టర్ మొబైల్ అవసరం.","mAadhaar (UIDAI app)"],["DigiLocker","ప్రభుత్వ డాక్యుమెంట్ వాలెట్. అధికారిక వెబ్‌సైట్ లేదా యాప్ ద్వారా మాత్రమే వాడండి; అపరిచితుడు పంపిన లింక్ ద్వారా కాదు.","digilocker.gov.in"]],"note":"అప్‌డేట్ లేదా పేమెంట్‌కు ముందు అడగండి: “ఇది ఏ డిపార్ట్‌మెంట్? ఈ పత్రం ఎందుకు కావాలి? అధికారిక అడ్రస్ నేనే టైప్ చేయవచ్చా?” సందేహం ఉంటే నమ్మకమైన వ్యక్తితో అధీకృత కేంద్రానికి వెళ్ళండి.","question":"Aadhaar యాక్టివ్‌గా ఉంచడానికి OTP కావాలని కాలర్ చెబితే, సురక్షితం ఏది?","options":["పేరు తెలుసు కాబట్టి OTP చెప్పండి","కాల్ ఆపి, UIDAI లేదా అధీకృత enrolment centre ద్వారా స్వతంత్రంగా తనిఖీ చేయండి","ముందు Aadhaar ఫోటో WhatsAppలో పంపండి"],"correct":1},{"title":"డిజిటల్ ఆరోగ్య సేవలు: రికార్డులు, అపాయింట్‌మెంట్, నమ్మకం","hook":"ఆన్‌లైన్ ఆరోగ్య సాధనాలు అపాయింట్‌మెంట్లు, రికార్డులు, ప్రొఫెషనల్ సలహాకు సహాయపడతాయి. అవి అత్యవసరం, అర్హత గల పరీక్ష లేదా మీ సమ్మతిని భర్తీ చేయవు.","steps":[["గుర్తింపు పొందిన ప్రొవైడర్ ఎంచుకోండి","తెలిసిన ఆసుపత్రి, ప్రభుత్వ ఆరోగ్య సేవ లేదా అర్హత గల ప్రొఫెషనల్‌ను వాడండి. టెలి కన్సల్టేషన్ ముందు ప్రొవైడర్/క్లినిక్ పేరు, ఫీజు, మళ్లీ సంప్రదించే విధానం తనిఖీ చేయండి."],["హెల్త్ రికార్డులు ప్రైవేట్‌గా ఉంచండి","రిపోర్టులు, ప్రిస్క్రిప్షన్, హెల్త్ ID, లక్షణాలు సున్నితమైనవి. ధృవీకరించిన క్లినిక్ ఛానెల్‌లో మాత్రమే పంచుకోండి. ABHA సర్వీస్‌లో రికార్డు పంచడానికి మీ సమ్మతి ఉండాలి; ఏమి అంగీకరిస్తున్నారో చదవండి."],["ఉపయోగకరమైన కన్సల్టేషన్‌కు సిద్ధం అవ్వండి","వయసు, లక్షణాలు, ఎంతకాలం, అలర్జీలు, మందులు, పాత రిపోర్టు సిద్ధంగా ఉంచండి. డాక్టర్ సలహా, ఫాలోఅప్ తేదీ, ప్రిస్క్రిప్షన్ రాసుకోండి. వీడియో లేదా ఫార్వర్డ్ చూసి స్వయంగా మందు వాడకండి."],["ఎమర్జెన్సీ హద్దు తెలుసుకోండి","తీవ్ర శ్వాస ఇబ్బంది, ఛాతీ నొప్పి, ఎక్కువ రక్తస్రావం, స్పృహ లేకపోవడం, విషం లేదా అత్యవసరంలో వెంటనే స్థానిక వైద్య సహాయం పొందండి. చాట్ రిప్లై కోసం వేచి ఉండకండి."]],"signal":"నిజమైన వైద్యుడు ర్యాండమ్ సోషల్ పోస్ట్‌లో అద్భుత చికిత్స హామీ ఇవ్వరు. అడ్వాన్స్ పేమెంట్, OTP, సోషల్ మీడియాలో పూర్తి రిపోర్ట్, మందు ఆపమనే వారి పట్ల జాగ్రత్త.","resources":[["eSanjeevani","ప్రభుత్వ టెలిమెడిసిన్ సేవ. రాష్ట్రం/సౌకర్యం ప్రకారం అందుబాటు మారవచ్చు; అధికారిక సైట్ లేదా ఆరోగ్య కేంద్రం ద్వారా ప్రారంభించండి.","esanjeevani.mohfw.gov.in"],["ABHA / ABDM","సమ్మతి ఆధారిత డిజిటల్ హెల్త్ వ్యవస్థ. ప్రస్తుత ఆప్షన్ల కోసం అధికారిక సైట్ లేదా పాల్గొనే సదుపాయాన్ని అడగండి.","abdm.gov.in"],["స్థానిక ఆరోగ్య కేంద్రం","తీవ్ర లక్షణాలు, గర్భ సంరక్షణ, పిల్లల జబ్బు, టీకా, మందుల ప్రశ్నలకు అర్హత గల స్థానిక ప్రొవైడర్ ఉత్తమ మొదటి కాంటాక్ట్ కావచ్చు.","ధృవీకరించిన స్థానిక కాంటాక్ట్"]],"note":"ఆన్‌లైన్ సమాచారం డాక్టర్‌తో మాట్లాడటానికి సహాయం చేస్తుంది, నిర్ధారణ కాదు. పాపులర్ వీడియో లేదా ఫార్వర్డ్ చూసి మందు, డోస్, చికిత్స మార్చకండి.","question":"“ఉచిత మందు” కోసం పబ్లిక్ చాట్‌లో ప్రిస్క్రిప్షన్ అడిగే అపరిచితుడికి ఏమి చేయాలి?","options":["వెంటనే అప్‌లోడ్ చేయండి","మీ క్లినిక్ లేదా ఆరోగ్య కేంద్రం వద్ద నేరుగా ధృవీకరించండి","ఎక్కువ అభిప్రాయాల కోసం అన్ని గ్రూపుల్లో పెట్టండి"],"correct":1},{"title":"స్మార్ట్ వ్యవసాయం: వాతావరణం, మార్కెట్ & సలహా","hook":"డిజిటల్ సాధనాలు ధర, వాతావరణం, పథకం సమాచారం ఇస్తాయి. నమ్మకమైన ఆన్‌లైన్ సమాచారం, స్థానిక పరిస్థితి, శిక్షణ పొందిన సలహాను కలిపితేనే ఉత్తమ నిర్ణయం వస్తుంది.","steps":[["మూలం, తేదీ, ప్రాంతం చూడండి","వాతావరణం లేదా పంట సలహాలో జారీ సంస్థ, తేదీ, జిల్లా/పంట చూడండి. వేరే సీజన్ లేదా ప్రాంతానికి చేసిన వీడియో మీ పొలానికి సరిపోకపోవచ్చు."],["ఖర్చు ముందు పోల్చండి","విత్తనం, ఎరువు, పురుగుమందు, నీటిపారుదల మార్చే ముందు వ్యవసాయ అధికారి, KVK/extension worker, ఉత్పత్తి లేబుల్, స్థానిక అనుభవంతో పోల్చండి. “రెట్టింపు దిగుబడి గ్యారెంటీ” సోషల్ విక్రేతకు డబ్బు ఇవ్వకండి."],["మార్కెట్ సమాచారం ఒక ఇన్‌పుట్ మాత్రమే","e-NAM, గుర్తింపు పొందిన మండీ సమాచారం ధర, మార్కెట్ యాక్టివిటీ పోల్చడానికి సహాయపడతాయి. అమ్మే ముందు పంట గ్రేడ్, యూనిట్, రవాణా ఖర్చు, స్థానిక మండీ విధానం ధృవీకరించండి."],["పథకం సమాచారం సురక్షితంగా చూడండి","PM-KISAN లేదా ఇతర లబ్ధికి అధికారిక పోర్టల్/యాప్, అధీకృత సహాయం వాడండి. లబ్ధి “ఆక్టివేట్” చేస్తాననే ఏజెంట్‌కు డబ్బు ఇవ్వకండి; eKYC పేరుతో OTP/PIN చెప్పకండి."]],"signal":"ఉపయోగకరమైన వ్యవసాయ సలహాలో పంట, పెరుగుదల దశ, స్థానిక పరిస్థితి, పరిమితులు ఉంటాయి. తక్షణ సబ్సిడీ, భారీ దిగుబడి, మాయ మందు అని చెల్లింపు అడిగే మెసేజ్ తొందర పెడుతుంది.","resources":[["e-NAM","జాతీయ వ్యవసాయ మార్కెట్ సమాచారం, మండీ ఆధారిత ట్రేడింగ్ వ్యవస్థ. ఆన్‌లైన్ ఆఫర్ నమ్మే ముందు స్థానిక మండీ ప్రక్రియ తెలుసుకోండి.","enam.gov.in"],["PM-KISAN","పథకం సమాచారం/స్టేటస్ అధికారిక పోర్టల్. తాజా నోటీసులో అర్హత, eKYC నియమాలు చూడండి.","pmkisan.gov.in"],["స్థానిక వ్యవసాయ సహాయం","వ్యవసాయ అధికారి, KVK, గుర్తింపు పొందిన సహకార సంస్థ, అధీకృత ఇన్‌పుట్ సలహాదారు ఆన్‌లైన్ సలహాను మీ పొలానికి అనుగుణంగా అర్థం చేయడంలో సహాయం చేస్తారు.","స్థానిక ధృవీకరణ"]],"note":"చిన్న వీడియో చూసి పురుగుమందులు కలపకండి లేదా డోస్ మార్చకండి. ఉత్పత్తి లేబుల్, అర్హత గల స్థానిక సలహా, భద్రతా చర్యలు పాటించండి; పిల్లలను రసాయనాల నుండి దూరంగా ఉంచండి.","question":"ఏ వ్యవసాయ మెసేజ్‌ను ఆపి తనిఖీ చేయాలి?","options":["స్థానిక వ్యవసాయ అధికారి ధృవీకరించిన తేదీ ఉన్న సలహా","“ఇప్పుడే చెల్లించండి—రేపు రెట్టింపు దిగుబడి గ్యారెంటీ”","గుర్తింపు పొందిన మూలంలో చూసిన స్థానిక వాతావరణ అప్‌డేట్"],"correct":1}]};
